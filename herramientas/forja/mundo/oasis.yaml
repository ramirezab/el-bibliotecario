  hoja: {color: '#5f9a3e', sombra: '#3d6a2a', hondo: '#29491c', luz: '#8cc25a', linea: '#1c3010', brillo: 0.25, ancho_sombra: 0.3}
  datil: {color: '#c9762e', sombra: '#8a4a1c', luz: '#f0a85a', brillo: 0.5}
  lona: {color: '#ecdcbc', sombra: '#c8b08a', hondo: '#9a845e', luz: '#fff6e2', linea: '#4a3820', ancho_sombra: 0.3}
  lona_dentro: {color: '#6e5038', sombra: '#4a3424', linea: '#2a1c10'}
  lona_roja: {color: '#b8473a', sombra: '#82302a', luz: '#dc6e5a', linea: '#3a1410'}
  piedra: {color: '#cfa978', sombra: '#a07c54', hondo: '#74583a', luz: '#ecd3a6', linea: '#3e2c18', ancho_sombra: 0.32}
  piedra_osc: {color: '#a8865e', sombra: '#7a5e40', hondo: '#54402a', luz: '#c8a67a', linea: '#2e2012'}
  barro: {color: '#b8663a', sombra: '#86442a', hondo: '#5a2c1a', luz: '#da8a5a', linea: '#3a1a0e', brillo: 0.25}
  madera: {color: '#9a7048', sombra: '#6a4a2e', hondo: '#46301e', luz: '#c09468', linea: '#2a1a0e', brillo: 0.15}
  cactus: {color: '#6a9a4a', sombra: '#466e30', hondo: '#2e4c20', luz: '#94c26a', linea: '#1a2e10', brillo: 0.2}
  seco: {color: '#a89a5a', sombra: '#7a6e3a', luz: '#cabc7a', linea: '#3a3418'}
  junco: {color: '#7aa04a', sombra: '#527034', luz: '#a8c86a', linea: '#22340e'}
  agua: {color: '#5cb8c4', sombra: '#3a8a9c', luz: '#c8f4f4', linea: '#1a4a58', brillo: 0.6}
  tela_azul: {color: '#3a6e9a', sombra: '#264c70', luz: '#5a90be', linea: '#122436'}
  sal: {color: '#f4eefb', sombra: '#b8b0d6', luz: '#ffffff', linea: '#3a3058', brillo: 0.9}

