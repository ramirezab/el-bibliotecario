# Elementos del Oasis de Sal para la demo, en el estilo de tinta. Se ven con la cámara de exploración
# (cenital en tres cuartos). Biblioteca: python -m forja hoja mundo/oasis.yaml --objeto palmera
nombre: Oasis
estilo: pluma
lienzo: [900, 900]
origen: [450, 820]
escala: 4
camara: {yaw: 0, pitch: 30}
luz: [-0.55, 0.65, 0.55]
tinta: '#1e140c'
grosor: 0.6
grosor_silueta: 0.9
linea_encima: true
peso_sombra: 0.45
grano: 0.04

materiales:
