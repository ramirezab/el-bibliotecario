  - {nombre: capa4, forma: cono, alto: 10, r1: 6, r2: 1.2, pos: [0, 31, 0], material: aguja, rugosidad: {escala: 1.3, fuerza: 0.7, semilla: 4}}
  - {nombre: capa5, forma: cono, alto: 9, r1: 3.8, r2: 0.3, pos: [0, 37, 0], material: aguja, rugosidad: {escala: 1.2, fuerza: 0.5, semilla: 5}}
