# Pino de bosque (vista cenital oblicua). Capas de conos con borde irregular.
nombre: Pino
lienzo: [56, 72]
origen: [28, 62]
camara: {proyeccion: oblicua, alto: 1.0, fondo: 0.55, yaw: 0}
luz: [-0.7, 0.7, 0.15]
tinta: '#101a14'
sombra_suelo: true
materiales:
  aguja: {color: '#2a6142', giro: 20, dL: 0.11, textura: {escala: 1.4, fuerza: 0.1}}
  tronco: {color: '#6b4a2b', textura: {escala: 1.2, fuerza: 0.08}}
huesos:
  - {nombre: raiz}
piezas:
