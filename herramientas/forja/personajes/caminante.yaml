# El protagonista como caminante del desierto, diseñado desde cero: capucha y capa verde oscuro gastadas
# por el viaje (ruedo deshilachado, capa abierta adelante con forro más oscuro), pelo café que asoma bajo la
# capucha, bufanda color arena para el polvo, túnica con cinturón, bolsa y morral, antebrazos y botas
# vendados con tiras de tela, y un bastón de caminante con un trapo atado.
# Unidades: 1 = 4 px. Mira hacia +Z; +X es su lado izquierdo.
nombre: Caminante
estilo: pluma
lienzo: [640, 640]
origen: [320, 600]
escala: 4
camara: {yaw: 30, pitch: 6}
luz: [-0.55, 0.6, 0.6]
tinta: '#15110c'
grosor: 0.55
grosor_silueta: 0.8
linea_encima: true
peso_sombra: 0.4
sombra_proyectada: 1.2
grano: 0.04
degradado: ['#ffffff', '#e2d4bc']
contraluz: ['#ffd9a0', 0.6, 0.35]
fondo_bruma: ['#2a2030', '#c48a55']

materiales:
  piel: {color: '#e9c29b', sombra: '#c98f74', luz: '#fbe2c6', linea: '#8a5a40', ancho_sombra: 0.25, suave: 1.6, sin_grano: true}
  ojo: {color: '#2b1d16'}
  pelo: {color: '#6b4528', sombra: '#4a2e1a', hondo: '#331f12', luz: '#8c6038', linea: '#2e1c10', ancho_sombra: 0.3, suave: 0.8}
  capa: {color: '#36462f', sombra: '#25311f', hondo: '#18201a', luz: '#4f6243', linea: '#121810', ancho_sombra: 0.3, suave: 1.6, borde_suave: [1.2, 0.4]}
  forro: {color: '#27321f', sombra: '#1b2316', linea: '#121810'}
  bufanda: {color: '#cdb48a', sombra: '#a68a62', hondo: '#7d6646', luz: '#e6d3ad', linea: '#4f3e28', ancho_sombra: 0.32, suave: 1.4}
  tunica: {color: '#9a7a52', sombra: '#755a3a', hondo: '#54402a', luz: '#b8966a', linea: '#3a2a18', ancho_sombra: 0.3, suave: 1.4}
  pantalon: {color: '#4e3e2e', sombra: '#36291d', linea: '#1e160f'}
  bota: {color: '#5e4128', sombra: '#3f2a1a', hondo: '#2a1b10', luz: '#7d5838', linea: '#22170d', brillo: 0.2, ancho_sombra: 0.3, suave: 1.0}
  venda: {color: '#d9c8a2', sombra: '#ad9a76', hondo: '#857356', linea: '#5a4a34', ancho_sombra: 0.3, suave: 1.0}
  cuero: {color: '#7a5232', sombra: '#553720', hondo: '#3a2514', luz: '#9a6c44', linea: '#2a1a0e', brillo: 0.2}
  laton: {color: '#c49a4a', sombra: '#8a6a2a', luz: '#f0d28a', linea: '#3a2a10', brillo: 0.8}
  madera: {color: '#7b5a3c', sombra: '#563d27', hondo: '#3b2919', luz: '#9e7a55', linea: '#24170d', brillo: 0.2}
  pluma: {color: '#efe6d4', sombra: '#b8ab92', hondo: '#8a7d66', linea: '#4a3e2c'}

huesos:
  - {nombre: raiz}
  - {nombre: cadera, padre: raiz, pos: [0, 44, 0]}
  - {nombre: torso, padre: cadera, pos: [0, 3, 0], rot: [5, 0, 0]}
  - {nombre: cuello, padre: torso, pos: [0, 24, 0.5], rot: [-4, 0, 0]}
  - {nombre: cabeza, padre: cuello, pos: [0, 19, 1.5]}
  - {nombre: capa, padre: torso, pos: [0, 22, -0.5]}
  - {nombre: capucha1, padre: cabeza, pos: [0, 12, -18.5]}
  - {nombre: capucha2, padre: capucha1, pos: [0, -5, -6]}
  - {nombre: capucha3, padre: capucha2, pos: [0, -7, -2.5]}
  - {nombre: hombro, padre: torso, pos: [9.5, 20.5, 0], rot: [0, 0, 7], espejo: true}
  - {nombre: codo, padre: hombro, pos: [0, -12.5, 0]}
  - {nombre: mano, padre: codo, pos: [0, -11, 0]}
  - {nombre: pierna, padre: cadera, pos: [4.8, -1, 0], rot: [0, 0, 3], espejo: true}
  - {nombre: rodilla, padre: pierna, pos: [0, -20, 0], rot: [4, 0, -3]}
  - {nombre: pie, padre: rodilla, pos: [0, -19.5, 0], rot: [-4, 0, 0]}
  - {nombre: baculo, padre: mano.d, pos: [0, -3.5, 1.2], apunta: [-0.3, 1, 0.1], frente: [-0.5, 0, 0.85]}
  - {nombre: trapo1, padre: baculo, pos: [0.8, 47, 1.4]}
  - {nombre: trapo2, padre: trapo1, pos: [0.8, -6, 1.2]}
  - {nombre: trapo3, padre: trapo2, pos: [0.4, -6, 0.8]}

pose_base:
  hombro.d: [-18, 0, 24]
  codo.d: [-52, 0, -12]

piezas:
  # ------------------------------------------------------------------ cabeza
  - nombre: cabeza
    hueso: cabeza
    forma: elipsoide
    r: [18.6, 18.2, 17.8]
    material: piel
    calcas:
      - {ovalo: [2.3, 3.4], centro: [7.2, -2.4], material: ojo, espejo: true, caras: [normal, decidido]}
      - {circulo: 0.9, centro: [6.4, -1.1], color: '#fff6e8', brillo: true, espejo: true, caras: [normal]}
      - {contorno: [[3.5, 2.6], [11, 2.6], [11, 0.0], [3.5, -1.6]], suave: false, material: piel, espejo: true, caras: [decidido]}
      - {trazo: [[5.2, -3.0], [7.2, -3.8], [9.2, -3.0]], anchos: [0.3, 0.9, 0.3], material: ojo, espejo: true, caras: [parpadeo]}
      # dolor: ojos apretados con arrugas de esfuerzo, cejas juntas, mueca de dientes apretados con las
      # comisuras hacia abajo, y una gota de sudor
      - {trazo: [[4.2, -1.4], [7.0, -2.4], [10.0, -3.8]], anchos: [0.7, 1.3, 0.5], material: ojo, espejo: true, caras: [dolor]}
      - {trazo: [[5.0, 0.2], [7.6, -0.4], [9.6, -1.4]], anchos: [0.1, 0.4, 0.1], material: ojo, espejo: true, caras: [dolor]}
      - {trazo: [[5.6, -4.4], [8.0, -5.0], [9.8, -5.8]], anchos: [0.1, 0.4, 0.1], material: ojo, espejo: true, caras: [dolor]}
      - {trazo: [[2.6, 2.2], [5.6, 3.6], [10.4, 2.0]], anchos: [0.9, 1.0, 0.3], color: '#4a2e1a', espejo: true, caras: [dolor]}
      - {contorno: [[-4.6, -11.2], [-2.0, -9.7], [2.0, -9.7], [4.6, -11.2], [3.8, -12.6], [-3.8, -12.6]], suave: false, color: '#4a1f1c', caras: [dolor]}
      - {contorno: [[-3.6, -10.6], [-1.8, -10.1], [1.8, -10.1], [3.6, -10.6], [3.2, -12.0], [-3.2, -12.0]], suave: false, color: '#fff4e6', brillo: true, caras: [dolor]}
      - {trazo: [[-3.4, -11.1], [0, -11.0], [3.4, -11.1]], ancho: 0.3, color: '#4a1f1c', brillo: true, caras: [dolor]}
      - {trazo: [[-1.2, -10.2], [-1.2, -11.9]], ancho: 0.22, color: '#4a1f1c', brillo: true, caras: [dolor]}
      - {trazo: [[1.2, -10.2], [1.2, -11.9]], ancho: 0.22, color: '#4a1f1c', brillo: true, caras: [dolor]}
      - {contorno: [[13.8, 3.0], [12.6, 0.0], [13.2, -1.8], [14.6, -1.8], [15.0, 0.0]], color: '#d4ecff', linea: true, brillo: true, caras: [dolor]}
      # decidido: cejas fruncidas
      - {trazo: [[3.6, 1.4], [6.8, 2.2], [10.4, 3.4]], anchos: [0.6, 1.0, 0.3], color: '#4a2e1a', espejo: true, caras: [decidido]}
      - {ovalo: [2.8, 1.5], centro: [11, -8], color: '#e98a74', opacidad: 0.45, blur: 0.6, espejo: true, sin_caras: [dolor]}
      - {trazo: [[-1.6, -10.4], [0, -11.0], [1.6, -10.4]], anchos: [0.25, 0.7, 0.25], color: '#7a3f30', caras: [normal, parpadeo, decidido]}
      - {contorno: [[-2.2, -9.8], [2.2, -9.8], [1.4, -12.4], [-1.4, -12.4]], color: '#6a2c26', caras: [dolor]}

  # ------------------------------------------------------------------ capucha: cubre la cabeza y deja ver la cara
  - nombre: capucha
    hueso: cabeza
    forma: elipsoide
    pos: [0, 2.6, -2.2]
    r: [22.0, 22.2, 22.6]
    material: capa
    grupo: capucha
    capa: 10
    calcas:
      - op: resta
        contorno: [[-15.8, -26], [-16.8, -10], [-16.6, 1], [-13.8, 9.2], [-7.6, 13.6], [0, 14.9], [7.6, 13.6], [13.8, 9.2], [16.6, 1], [16.8, -10], [15.8, -26]]
      # el borde de la capucha tiene grosor: una banda más oscura justo afuera del hueco
      - {trazo: [[-16.5, -11], [-16.4, 1], [-13.6, 9.5], [-7.5, 13.9], [0, 15.2], [7.5, 13.9], [13.6, 9.5], [16.4, 1], [16.5, -11]], anchos: [0.5, 1.6, 2.0, 2.0, 2.0, 2.0, 2.0, 1.6, 0.5], color: '#1d2619'}
  - nombre: caida_capucha
    hueso: cabeza
    forma: casco
    esferas: [[-15.5, -9, -3, 5.5], [15.5, -9, -3, 5.5], [0, -11, -13, 6.5], [torso, -11.5, 22, -1, 5.0], [torso, 11.5, 22, -1, 5.0], [torso, 0, 23, -6.5, 5.5]]
    material: capa
    capa: -3
  - nombre: punta_capucha
    hueso: capucha1
    forma: tubo
    puntos: [[capucha1, 0, 3, 3, 7.0], [capucha2, 0, 0, 0, 4.4], [capucha3, 0, 0, 0, 1.8], [capucha3, 0, -4.5, -0.8, 0.2]]
    material: capa

  # ------------------------------------------------------------------ pelo café que asoma bajo la capucha
  - nombre: flequillo
    hueso: cabeza
    forma: mechones
    pos: [0, 1.0, 0]
    sobre: [19.2, 18.8, 18.4]
    material: pelo
    grupo: pelo
    capa: -10
    lista:
      - {en: [-12.5, 13], hacia: -100, curva: 16, largo: 9, ancho: 3.4, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [-6, 15], hacia: -92, curva: 10, largo: 10, ancho: 3.8, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [1, 15.5], hacia: -86, curva: -12, largo: 9.5, ancho: 3.8, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [7.5, 14.5], hacia: -78, curva: -16, largo: 9, ancho: 3.6, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [13, 12], hacia: -74, curva: -14, largo: 8, ancho: 3.2, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [-15.5, 6], hacia: -96, curva: 10, largo: 12, ancho: 2.8, perfil: [1, 0.85, 0.05], alza: [0.7, 0.9]}
      - {en: [15.5, 6], hacia: -84, curva: -10, largo: 12, ancho: 2.8, perfil: [1, 0.85, 0.05], alza: [0.7, 0.9]}

  # ------------------------------------------------------------------ bufanda color arena
  - nombre: bufanda_atras
    hueso: cuello
    forma: tubo
    puntos: [[-8.4, 0, 0], [-6.0, 0.6, -6], [0, 1.0, -8.0], [6.0, 0.6, -6], [8.4, 0, 0]]
    radio: 3.8
    material: bufanda
  - nombre: bufanda
    hueso: cuello
    forma: tubo
    puntos: [[8.6, 0, 0], [6.8, -0.8, 5.8], [0, -1.8, 8.6], [-6.8, -0.8, 6.0], [-8.6, 0, 0]]
    radio: 3.9
    material: bufanda
    capa: 8
    trazos:
      - {puntos: [[6.5, 2.5, 8.2], [0, 1.0, 12.4], [-6.5, 2.3, 8.6]], anchos: [0, 0.5, 0], tono: hondo, normal: [0, 0, 1]}
  - nombre: bufanda_vuelta
    hueso: cuello
    forma: tubo
    puntos: [[9.4, -4, 1], [7.0, -5.8, 7.2], [0, -7.0, 9.8], [-7.0, -6.0, 7.6], [-9.4, -4, 1]]
    radio: 3.2
    material: bufanda
    capa: 7.5
    trazos:
      - {puntos: [[5, -5.4, 11], [0, -6.4, 13.6], [-5, -5.6, 11.4]], anchos: [0, 0.45, 0], tono: hondo, normal: [0, 0, 1]}
  - nombre: cola_bufanda
    hueso: cuello
    forma: cinta
    puntos: [[-5.5, -7, 10], [torso, -7.0, 12, 10.5], [torso, -7.6, 4, 11.2]]
    ancho: 5.0
    normal: [0, 0, 1]
    cola: v
    material: bufanda
    capa: 8.5
    trazos:
      - {puntos: [[-5.5, -7, 10.3], [torso, -7.0, 11, 10.8], [torso, -7.5, 5.5, 11.4]], anchos: [0, 0.35, 0], tono: hondo}

  # ------------------------------------------------------------------ manto corto sobre los hombros, deshilachado
  - nombre: manto
    hueso: capa
    forma: campana
    aros: [[3, 9, 7.5], [-2, 15.5, 11.5], [-12, 19.5, 14]]
    ondas: 11
    puntas: true
    caidas: [3.5, 2.2, 4.2, 2.8, 3.8, 2.0, 4.5, 2.6, 3.4, 2.4, 4.0]
    redondeo: 1.6
    material: capa
    capa: 7
    trazos:
      - {puntos: [[-4, 2, 8.5], [-7.5, -5, 12.5], [-10, -12, 14.2]], anchos: [0, 0.5, 0], tono: hondo, normal: [0, 0, 1]}
      - {puntos: [[5, 1.5, 8.5], [9, -5, 12], [12, -12, 13.5]], anchos: [0, 0.45, 0], tono: hondo, normal: [0.3, 0, 1]}

  # ------------------------------------------------------------------ capa larga abierta adelante, ruedo deshilachado
  - nombre: capa_larga
    hueso: capa
    forma: campana
    aros: [[0, 9.5, 7.5], [-6, 14.5, 10.5], [-20, 18, 12.5], [-40, 21.5, 14.5], [-60, 24.5, 16.5]]
    ondas: 18
    fase: 10
    abertura: 64
    puntas: true
    caidas: [2.5, 1.5, 3.2, 2.0, 2.8, 1.4, 3.6, 2.2, 2.6, 1.8, 3.0, 1.6, 3.4, 2.0, 2.4, 1.5, 3.1, 2.2]
    redondeo: 1.4
    material: capa
    reverso: forro
    capa: 6
    capa_atras: -18
    trazos:
      - {puntos: [[14, -14, 6], [17.5, -34, 7], [20.5, -57, 7.5]], anchos: [0, 0.5, 0.1], tono: hondo, normal: [0.8, 0, 0.6]}
      - {puntos: [[-14, -14, 6], [-17.5, -34, 7], [-20.5, -57, 7.5]], anchos: [0, 0.5, 0.1], tono: hondo, normal: [-0.8, 0, 0.6]}

  # ------------------------------------------------------------------ túnica, cinturón, bolsa y morral
  - nombre: tunica
    hueso: torso
    forma: casco
    esferas: [[-7.5, 19, 0, 5], [7.5, 19, 0, 5], [0, 20, 1, 5.5], [-6, 9, 1, 6], [6, 9, 1, 6], [0, 10, 2.5, 6.2], [-5.5, 0, 0, 5.8], [5.5, 0, 0, 5.8], [0, 0, 1.8, 5.8]]
    material: tunica
    trazos:
      - {puntos: [[0.5, 21, 6.6], [0.8, 14, 8.6], [0.6, 6, 8.2]], anchos: [0.2, 0.45, 0.2], tono: linea, normal: [0, 0, 1]}
  - nombre: faldon
    hueso: cadera
    forma: casco
    esferas: [[-6, 2, 0, 5.5], [6, 2, 0, 5.5], [0, 2, 2, 5.5], [-8.5, -15, 1, 1.2], [8.5, -15, 1, 1.2], [0, -16, 4.5, 1.2], [0, -14, -4, 1.2], [-6, -15.5, 4, 1.2], [6, -15.5, 4, 1.2]]
    material: tunica
    trazos:
      - {puntos: [[0.5, -4, 7.4], [0.6, -10, 6.4], [0.4, -15.5, 4.8]], anchos: [0.4, 0.5, 0.4], tono: linea, normal: [0, 0, 1]}
      - {puntos: [[-5.5, -14.2, 4.6], [0, -15.0, 5.6], [5.5, -14.2, 4.6]], ancho: 0.25, guiones: [0.7, 0.6], tono: luz, normal: [0, 0, 1]}
  - nombre: cinturon
    hueso: torso
    forma: tubo
    puntos: [[-11.4, 0.5, 0], [-8.2, 0.5, 5.2], [0, 0.6, 7.8], [8.2, 0.5, 5.2], [11.4, 0.5, 0]]
    radio: 1.5
    material: cuero
    capa: 0.5
  - {nombre: hebilla, hueso: torso, forma: lamina, pos: [-2.5, 0.6, 9.0], rot: [0, -8, 0], rect: [3.2, 3.0], radio: 0.5, agujeros: [{rect: [1.6, 1.4]}], material: laton, una_cara: true, capa: 0.8, grosor: 0.7}
  - {nombre: bolsa, hueso: torso, forma: caja, pos: [6.5, -3.0, 6.4], rot: [0, 28, 0], tam: [4.6, 5.4, 2.8], radio: 1.0, material: cuero, capa: 1.0}
  - {nombre: tapa_bolsa, hueso: torso, forma: lamina, pos: [6.9, -1.6, 7.9], rot: [0, 28, 0], contorno: [[-2.4, 1.4], [2.4, 1.4], [2.2, -1.2], [0, -2.0], [-2.2, -1.2]], material: cuero, una_cara: true, capa: 1.2, grosor: 0.6}
  - nombre: correa
    hueso: torso
    forma: cinta
    puntos: [[cadera, -9, 0, 4.5], [torso, -5, 7, 8.4], [torso, 3.5, 15, 8.0], [torso, 9.0, 21, 3.0], [torso, 9.8, 23, -1]]
    ancho: 2.2
    normal: [0, 0, 1]
    material: cuero
    capa: 1.5
  - {nombre: morral, hueso: cadera, forma: caja, pos: [-11.5, -5, 3], rot: [0, -60, 4], tam: [9, 8, 3.4], radio: 1.4, material: cuero, capa: 1.6,
     trazos: [{puntos: [[-4, 2.6, 1.8], [0, 1.4, 1.9], [4, 2.6, 1.8]], ancho: 0.3, tono: hondo}]}

  # ------------------------------------------------------------------ brazos con mangas y antebrazos vendados
  - nombre: manga
    hueso: hombro
    forma: tubo
    puntos: [[0, 1.5, 0, 3.8], [codo, 0, 0, 0, 3.3], [codo, 0, -3, 0, 3.2]]
    material: tunica
    fuera_de: [capa_larga, manto]
    capa: 12
  - nombre: venda
    hueso: codo
    forma: tubo
    puntos: [[0, -2.5, 0, 3.3], [mano, 0, 2.2, 0, 3.0]]
    material: venda
    fuera_de: [capa_larga, manto]
    capa: 12.2
    trazos:
      - {puntos: [[-3.3, -4.5, 0.5], [0, -5.8, 3.4], [3.3, -4.5, 0.5]], ancho: 0.35, tono: hondo}
      - {puntos: [[-3.2, -7.5, 0.5], [0, -8.8, 3.3], [3.2, -7.5, 0.5]], ancho: 0.35, tono: hondo}
  - nombre: mano
    hueso: mano
    forma: casco
    esferas: [[0, -0.5, 0, 2.8], [0, -4.0, 0.4, 2.7], [0.5, -6.2, 0.8, 2.1]]
    material: piel
    fuera_de: [capa_larga, manto]
    capa: 12.4
  - {nombre: pulgar, hueso: mano, forma: tubo, puntos: [[0, -1.5, 2.2, 1.2], [0.2, -3.8, 3.6, 1.0]], material: piel, fuera_de: [capa_larga, manto], capa: 12.6}

  # ------------------------------------------------------------------ piernas y botas vendadas
  - nombre: pierna
    hueso: pierna
    forma: tubo
    puntos: [[0, 1, 0, 4.3], [rodilla, 0, 0, 0.3, 3.8], [rodilla, 0, -6, 0.2, 3.6]]
    material: pantalon
    capa: -3
  - nombre: cana
    hueso: rodilla
    forma: tubo
    puntos: [[0, -5, 0.2, 4.0], [pie, 0, 2, 0, 3.8]]
    material: bota
    capa: -2.5
    trazos:
      - {puntos: [[-4.1, -8, 0.8], [0, -9.2, 4.2], [4.1, -8, 0.8]], ancho: 1.1, tono: '#cfbd96'}
      - {puntos: [[-4.0, -12, 0.8], [0, -13.0, 4.1], [4.0, -12, 0.8]], ancho: 1.1, tono: '#cfbd96'}
      - {puntos: [[-3.9, -16, 0.8], [0, -16.6, 4.0], [3.9, -16, 0.8]], ancho: 1.1, tono: '#cfbd96'}
  - nombre: bota
    hueso: pie
    forma: casco
    esferas: [[0, 1.0, 0, 3.9], [0, -2.0, -1.2, 3.4], [0, -2.2, 4.8, 2.9], [0, -1.2, 2.2, 3.4]]
    material: bota
    capa: -2
    trazos:
      - {puntos: [[-3.0, -4.6, -2.6], [-3.1, -4.6, 2.0], [-2.7, -4.6, 6.6]], ancho: 0.7, tono: hondo}

  # ------------------------------------------------------------------ bastón de caminante con un trapo atado
  - nombre: vara
    hueso: baculo
    forma: tubo
    puntos: [[0, -46, 0, 1.1], [0.5, -10, 0.2, 1.2], [-0.4, 20, 0, 1.25], [0.9, 40, 0.5, 1.4], [0, 50, 0, 1.5]]
    material: madera
    capa: 20
    trazos:
      - {puntos: [[0.6, 24, 1.2], [0.8, 34, 1.3]], anchos: [0, 0.3, 0], tono: hondo}
      - {puntos: [[-0.4, -20, 1.1], [-0.2, -4, 1.2]], anchos: [0, 0.3, 0], tono: hondo}
  - {nombre: nudo, hueso: baculo, forma: elipsoide, pos: [0.2, 51.5, 0], r: [2.3, 2.6, 2.3], material: madera, capa: 20.1}
  - {nombre: atadura, hueso: baculo, forma: cilindro, a: [0.8, 45, 0.4], b: [0.8, 48.5, 0.4], r: 1.7, material: venda, capa: 20.2,
     trazos: [{puntos: [[-0.9, 45.8, 2.0], [2.5, 46.8, 1.6]], ancho: 0.3, tono: hondo}, {puntos: [[-0.9, 47.2, 2.0], [2.5, 48.2, 1.6]], ancho: 0.3, tono: hondo}]}
  - nombre: trapo
    hueso: trapo1
    forma: cinta
    puntos: [[trapo1, 0, 0, 0], [trapo2, 0, 0, 0], [trapo3, 0, 0, 0], [trapo3, 0.3, -5, 0.4]]
    anchos: [2.6, 2.4, 2.2]
    normal: [0, 0, 1]
    cola: v
    material: venda
    capa: 20.3
  - {nombre: cordel, hueso: baculo, forma: tubo, puntos: [[-1.2, 46, 0.6, 0.25], [-2.2, 42, 0.8, 0.25], [-2.4, 39, 1.0, 0.25]], material: cuero, capa: 20.2}
  - {nombre: amuleto, hueso: baculo, forma: lamina, pos: [-2.4, 35.5, 1.2], rot: [0, -30, 8], contorno: [[0, 3.5], [-1.2, 1.5], [-1.4, -2], [0, -4.5], [1.3, -2], [1.2, 1.5]], material: pluma, capa: 20.4, grosor: 0.6,
     trazos: [{puntos: [[0, 3.5, 0.05], [0, -4.2, 0.05]], anchos: [0.3, 0.1], tono: hondo}]}

animaciones:
  # Las capas, la punta de la capucha y el trapo del bastón arrastran el movimiento (retraso o fase corrida),
  # y las claves usan curvas: salida (frena), entrada (acelera), sobrepaso (se pasa y vuelve).
  reposo:
    cuadros: 32
    fps: 20
    caras: [{desde: 0.62, hasta: 0.68, cara: parpadeo}]
    pose:
      cadera: [0, 0, '1.2*sin(tau*t)']
      torso: {rot: ['1.5*sin(tau*t)', 0, '-1.0*sin(tau*t)'], pos: [0, '0.5*sin(tau*t)', 0]}
      cabeza: ['-2*sin(tau*t + 0.7)', '4*sin(tau*t - 0.3)', '1.5*sin(tau*t + 0.3)']
      capa: ['-2.5*sin(tau*t - 0.6)', '2*sin(tau*t - 0.9)', '2.2*sin(tau*t - 1.0)']
      capucha2: ['6*sin(tau*t - 0.8)', 0, '4*sin(tau*t - 1.0)']
      capucha3: ['9*sin(tau*t - 1.6)', 0, '6*sin(tau*t - 1.8)']
      hombro.d: ['2.5*sin(tau*t + 0.4)', 0, '1.5*sin(tau*t)']
      trapo2: ['10*sin(2*tau*t - 0.4)', 0, '12*sin(tau*t - 0.4)']
      trapo3: ['14*sin(2*tau*t - 1.2)', 0, '14*sin(tau*t - 1.2)']

  caminar:
    cuadros: 16
    fps: 20
    pose:
      raiz: {pos: [0, '1.6*abs(cos(tau*t))', 0]}
      cadera: [0, '6*sin(tau*t)', '2*cos(tau*t)']
      pierna.i: ['26*sin(tau*t)', 0, 0]
      pierna.d: ['-26*sin(tau*t)', 0, 0]
      rodilla.i: ['6 + 24*max(0, -cos(tau*t))', 0, 0]
      rodilla.d: ['6 + 24*max(0, cos(tau*t))', 0, 0]
      pie.i: ['-8*max(0, -cos(tau*t)) + 6*sin(tau*t)', 0, 0]
      pie.d: ['-8*max(0, cos(tau*t)) - 6*sin(tau*t)', 0, 0]
      torso: [5, '-7*sin(tau*t)', '-1.5*cos(tau*t)']
      cabeza: ['-1.5*abs(cos(tau*t))', '4*sin(tau*t)', '1.5*cos(tau*t)']
      hombro.d: ['-10*sin(tau*t)', 0, 0]
      capa: ['7 + 3*abs(cos(tau*t - 0.6))', '-5*sin(tau*t - 0.6)', '4*cos(tau*t - 0.7)']
      capucha2: ['10 + 7*abs(cos(tau*t - 0.9))', 0, '5*sin(tau*t - 1.0)']
      capucha3: ['12 + 10*abs(cos(tau*t - 1.4))', 0, '7*sin(tau*t - 1.5)']
      trapo2: ['20 + 12*sin(2*tau*t - 0.5)', 0, '14*sin(tau*t - 0.4)']
      trapo3: ['24 + 16*sin(2*tau*t - 1.3)', 0, '16*sin(tau*t - 1.2)']

  ataque:
    cuadros: 28
    fps: 24
    bucle: false
    retraso: {capa: 0.06, capucha2: 0.08, capucha3: 0.12, trapo2: 0.07, trapo3: 0.11}
    claves:
      - {t: 0, pose: {}}
      # preparación: baja el cuerpo y lleva el bastón hacia atrás por su costado
      - t: 0.2
        curva: salida
        cara: decidido
        apunta: {baculo: {hacia: [-0.45, 0.45, -0.77], frente: [-0.5, 0, 0.85]}}
        pose:
          cadera: {pos: [0, -2.6, -1.5]}
          torso: [-8, -10, 0]
          cabeza: [6, 12, 0]
          hombro.d: [110, 0, 30]
          codo.d: [-15, 0, 0]
          pierna.d: [-12, 0, 0]
          pierna.i: [8, 0, 0]
          rodilla.i: [14, 0, 0]
          rodilla.d: [10, 0, 0]
          capa: [-6, 4, 4]
          capucha2: [-4, 0, 0]
          trapo2: [-10, 0, 0]
          trapo3: [-10, 0, 0]
      - t: 0.27
        curva: suave
        cara: decidido
        apunta: {baculo: {hacia: [-0.5, 0.55, -0.67], frente: [-0.5, 0, 0.85]}}
        pose:
          cadera: {pos: [0, -2.9, -1.6]}
          torso: [-9, -12, 0]
          cabeza: [6, 13, 0]
          hombro.d: [130, 0, 30]
          codo.d: [-15, 0, 0]
          pierna.d: [-12, 0, 0]
          pierna.i: [8, 0, 0]
          rodilla.i: [15, 0, 0]
          rodilla.d: [11, 0, 0]
          capa: [-7, 4, 4]
          capucha2: [-5, 0, 0]
          trapo2: [-12, 0, 0]
          trapo3: [-12, 0, 0]
      # pasa el bastón por arriba, acelerando
      - t: 0.36
        curva: entrada
        cara: decidido
        apunta: {baculo: {hacia: [0.0, 1.0, 0.15], frente: [-0.5, 0, 0.85]}}
        pose:
          raiz: {pos: [0, 0, 2]}
          cadera: {pos: [0, -1.2, 1]}
          torso: [2, 6, 0]
          cabeza: [0, 2, 0]
          hombro.d: [185, 0, 26]
          codo.d: [-10, 0, 0]
          pierna.d: [6, 0, 0]
          pierna.i: [-4, 0, 0]
          capa: [4, 0, 0]
      # golpe: paso adelante y el bastón baja de frente
      - t: 0.44
        curva: lineal
        cara: decidido
        apunta: {baculo: {hacia: [0.5, -0.35, 0.8], frente: [-0.5, 0.3, 0.8]}}
        pose:
          raiz: {pos: [0, 0, 7]}
          cadera: {pos: [0, -3.6, 0]}
          torso: [16, 24, 0]
          cabeza: [-6, -8, 0]
          hombro.d: [275, 0, 8]
          codo.d: [12, 0, 0]
          pierna.d: [24, 0, 0]
          pierna.i: [-20, 0, 0]
          rodilla.d: [22, 0, 0]
          rodilla.i: [6, 0, 0]
          capa: [-12, -4, -8]
          capucha2: [-18, 0, 0]
          capucha3: [-16, 0, 0]
          trapo2: [-34, 0, 0]
          trapo3: [-30, 0, 0]
      # el bastón se pasa un poco y se asienta
      - t: 0.52
        curva: sobrepaso
        cara: decidido
        apunta: {baculo: {hacia: [0.36, -0.62, 0.7], frente: [-0.5, 0.3, 0.8]}}
        pose:
          raiz: {pos: [0, 0, 7.5]}
          cadera: {pos: [0, -3.8, 0]}
          torso: [19, 28, 0]
          cabeza: [-5, -10, 0]
          hombro.d: [290, 0, 6]
          codo.d: [10, 0, 0]
          pierna.d: [24, 0, 0]
          pierna.i: [-20, 0, 0]
          rodilla.d: [22, 0, 0]
          rodilla.i: [6, 0, 0]
          capa: [-8, -2, -6]
          capucha2: [-10, 0, 0]
          capucha3: [-12, 0, 0]
          trapo2: [-20, 0, 0]
          trapo3: [-24, 0, 0]
      # vuelve a la guardia
      - t: 0.72
        curva: suave
        cara: normal
        apunta: {baculo: {hacia: [-0.4, 0.85, 0.3], frente: [-0.5, 0, 0.85]}}
        pose:
          raiz: {pos: [0, 0, 3]}
          cadera: {pos: [0, -1.5, 0]}
          torso: [6, 10, 0]
          cabeza: [-1, -3, 0]
          hombro.d: [330, 0, 26]
          codo.d: [-30, 0, -8]
          pierna.d: [8, 0, 0]
          pierna.i: [-6, 0, 0]
          capa: [-2, 0, -2]
      - t: 1
        curva: sobrepaso
        pose:
          hombro.d: [360, 0, 0]

  golpe:
    cuadros: 18
    fps: 24
    bucle: false
    retraso: {capa: 0.08, capucha2: 0.1, capucha3: 0.14, trapo2: 0.08, trapo3: 0.12}
    claves:
      - {t: 0, pose: {}}
      # lo empujan: sale despedido hacia atrás
      - t: 0.05
        curva: lineal
        cara: dolor
        pose:
          raiz: {pos: [-2, 1.2, -3]}
          torso: [-10, -5, 4]
          cabeza: [6, -6, 5]
      - t: 0.12
        curva: salida
        cara: dolor
        pose:
          raiz: {pos: [-4, 2.5, -6]}
          torso: [-16, -10, 8]
          cabeza: [16, -14, 10]
          hombro.d: [30, 0, 26]
          codo.d: [-20, 0, 0]
          pierna.d: [-14, 0, 0]
          pierna.i: [-8, 0, 0]
          capa: [16, 6, 10]
          capucha2: [22, 0, 0]
          capucha3: [20, 0, 0]
          trapo2: [30, 0, 0]
          trapo3: [30, 0, 0]
      # aterriza doblando las rodillas
      - t: 0.26
        curva: salida
        cara: dolor
        pose:
          raiz: {pos: [-8, 0, -10]}
          cadera: {pos: [0, -3.5, 0]}
          torso: [-4, -6, 4]
          cabeza: [14, -8, 6]
          hombro.d: [12, 0, 14]
          rodilla.i: [22, 0, 0]
          rodilla.d: [18, 0, 0]
          capa: [6, 2, 4]
          capucha2: [8, 0, 0]
      # sacude la cabeza
      - t: 0.42
        cara: dolor
        pose:
          raiz: {pos: [-8, 0, -10]}
          cadera: {pos: [0, -2, 0]}
          torso: [-2, 0, 0]
          cabeza: [10, 12, -5]
          rodilla.i: [10, 0, 0]
          rodilla.d: [8, 0, 0]
      - t: 0.56
        cara: dolor
        pose:
          raiz: {pos: [-8, 0, -10]}
          cadera: {pos: [0, -1.6, 0]}
          torso: [-1, 0, 0]
          cabeza: [8, -10, 4]
          rodilla.i: [8, 0, 0]
          rodilla.d: [6, 0, 0]
      # se recompone
      - t: 0.74
        cara: decidido
        pose:
          raiz: {pos: [-4, 0, -5]}
          cadera: {pos: [0, -1, 0]}
          torso: [2, 4, 0]
      - {t: 1, curva: sobrepaso, cara: normal, pose: {}}
