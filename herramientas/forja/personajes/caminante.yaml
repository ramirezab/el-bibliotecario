# El protagonista como caminante del desierto, diseñado desde cero: capucha y capa verde oscuro gastadas
# por el viaje (ruedo deshilachado, capa abierta adelante con forro más oscuro), pelo café que asoma bajo la
# capucha, bufanda color arena para el polvo, túnica con cinturón, bolsa y morral, antebrazos y botas
# vendados con tiras de tela, y un bastón de caminante con un trapo atado.
# Unidades: 1 = 4 px. Mira hacia +Z; +X es su lado izquierdo.
nombre: Caminante
estilo: pluma
lienzo: [640, 640]
origen: [320, 600]
escala: 4
camara: {yaw: 30, pitch: 6}
luz: [-0.55, 0.6, 0.6]
tinta: '#15110c'
grosor: 0.55
grosor_silueta: 0.8
linea_encima: true
peso_sombra: 0.4
sombra_proyectada: 1.2
grano: 0.04
degradado: ['#ffffff', '#e2d4bc']
contraluz: ['#ffd9a0', 0.6, 0.35]
fondo_bruma: ['#2a2030', '#c48a55']

materiales:
  piel: {color: '#e9c29b', sombra: '#c98f74', luz: '#fbe2c6', linea: '#8a5a40', ancho_sombra: 0.25, suave: 1.6, sin_grano: true}
  ojo: {color: '#2b1d16'}
  pelo: {color: '#6b4528', sombra: '#4a2e1a', hondo: '#331f12', luz: '#8c6038', linea: '#2e1c10', ancho_sombra: 0.3, suave: 0.8}
  capa: {color: '#36462f', sombra: '#25311f', hondo: '#18201a', luz: '#4f6243', linea: '#121810', ancho_sombra: 0.3, suave: 1.6, borde_suave: [1.2, 0.4]}
  forro: {color: '#27321f', sombra: '#1b2316', linea: '#121810'}
  bufanda: {color: '#cdb48a', sombra: '#a68a62', hondo: '#7d6646', luz: '#e6d3ad', linea: '#4f3e28', ancho_sombra: 0.32, suave: 1.4}
  tunica: {color: '#9a7a52', sombra: '#755a3a', hondo: '#54402a', luz: '#b8966a', linea: '#3a2a18', ancho_sombra: 0.3, suave: 1.4}
  pantalon: {color: '#4e3e2e', sombra: '#36291d', linea: '#1e160f'}
  bota: {color: '#5e4128', sombra: '#3f2a1a', hondo: '#2a1b10', luz: '#7d5838', linea: '#22170d', brillo: 0.2, ancho_sombra: 0.3, suave: 1.0}
  venda: {color: '#d9c8a2', sombra: '#ad9a76', hondo: '#857356', linea: '#5a4a34', ancho_sombra: 0.3, suave: 1.0}
  cuero: {color: '#7a5232', sombra: '#553720', hondo: '#3a2514', luz: '#9a6c44', linea: '#2a1a0e', brillo: 0.2}
  laton: {color: '#c49a4a', sombra: '#8a6a2a', luz: '#f0d28a', linea: '#3a2a10', brillo: 0.8}
  madera: {color: '#7b5a3c', sombra: '#563d27', hondo: '#3b2919', luz: '#9e7a55', linea: '#24170d', brillo: 0.2}
  pluma: {color: '#efe6d4', sombra: '#b8ab92', hondo: '#8a7d66', linea: '#4a3e2c'}

huesos:
  - {nombre: raiz}
  - {nombre: cadera, padre: raiz, pos: [0, 44, 0]}
  - {nombre: torso, padre: cadera, pos: [0, 3, 0], rot: [5, 0, 0]}
  - {nombre: cuello, padre: torso, pos: [0, 24, 0.5], rot: [-4, 0, 0]}
  - {nombre: cabeza, padre: cuello, pos: [0, 19, 1.5]}
  - {nombre: capa, padre: torso, pos: [0, 22, -0.5]}
  - {nombre: capucha1, padre: cabeza, pos: [0, 12, -18.5]}
  - {nombre: capucha2, padre: capucha1, pos: [0, -5, -6]}
  - {nombre: capucha3, padre: capucha2, pos: [0, -7, -2.5]}
  - {nombre: hombro, padre: torso, pos: [9.5, 20.5, 0], rot: [0, 0, 7], espejo: true}
  - {nombre: codo, padre: hombro, pos: [0, -12.5, 0]}
  - {nombre: mano, padre: codo, pos: [0, -11, 0]}
  - {nombre: pierna, padre: cadera, pos: [4.8, -1, 0], rot: [0, 0, 3], espejo: true}
  - {nombre: rodilla, padre: pierna, pos: [0, -20, 0], rot: [4, 0, -3]}
  - {nombre: pie, padre: rodilla, pos: [0, -19.5, 0], rot: [-4, 0, 0]}
  - {nombre: baculo, padre: mano.d, pos: [0, -3.5, 1.2], apunta: [-0.3, 1, 0.1], frente: [-0.5, 0, 0.85]}
  - {nombre: trapo1, padre: baculo, pos: [0.8, 47, 1.4]}
  - {nombre: trapo2, padre: trapo1, pos: [0.8, -6, 1.2]}
  - {nombre: trapo3, padre: trapo2, pos: [0.4, -6, 0.8]}

pose_base:
  hombro.d: [-18, 0, 24]
  codo.d: [-52, 0, -12]

piezas:
  # ------------------------------------------------------------------ cabeza
  - nombre: cabeza
    hueso: cabeza
    forma: elipsoide
    r: [18.6, 18.2, 17.8]
    material: piel
    calcas:
      - {ovalo: [2.3, 3.4], centro: [7.2, -2.4], material: ojo, espejo: true, caras: [normal, decidido]}
      - {circulo: 0.9, centro: [6.4, -1.1], color: '#fff6e8', brillo: true, espejo: true, caras: [normal]}
      - {contorno: [[3.5, 2.6], [11, 2.6], [11, 0.0], [3.5, -1.6]], suave: false, material: piel, espejo: true, caras: [decidido]}
      - {trazo: [[5.2, -3.0], [7.2, -3.8], [9.2, -3.0]], anchos: [0.3, 0.9, 0.3], material: ojo, espejo: true, caras: [parpadeo]}
      # caras de dolor para elegir (dolor1..dolor6); la que diga `dolor` es la que usa la animación de golpe
      # 1. sorpresa: ojos abiertos de golpe con la pupila chica, cejas de angustia y boca en O
      - {ovalo: [2.7, 3.3], centro: [7.2, -2.4], color: '#fffaf2', linea: true, espejo: true, caras: [dolor1]}
      - {circulo: 0.95, centro: [7.0, -2.7], material: ojo, espejo: true, caras: [dolor1]}
      - {trazo: [[3.6, 4.8], [6.8, 3.8], [10.4, 2.2]], anchos: [0.9, 1.0, 0.3], color: '#4a2e1a', espejo: true, caras: [dolor1]}
      - {ovalo: [1.7, 2.2], centro: [0, -11.4], color: '#5a1f22', caras: [dolor1]}
      - {ovalo: [1.0, 0.6], centro: [0, -12.6], color: '#c9545c', caras: [dolor1]}
      - {contorno: [[13.8, 3.0], [12.6, 0.0], [13.2, -1.8], [14.6, -1.8], [15.0, 0.0]], color: '#d4ecff', linea: true, brillo: true, caras: [dolor1]}
      # 2. aguanta: ojos apretados con arrugas, ceño fruncido y dientes apretados de lado a lado
      - {trazo: [[4.2, -1.2], [7.2, -2.6], [10.4, -3.2]], anchos: [0.7, 1.4, 0.6], material: ojo, espejo: true, caras: [dolor2, dolor]}
      - {trazo: [[5.0, 0.4], [7.4, -0.3], [9.6, -1.0]], anchos: [0.1, 0.4, 0.1], material: ojo, espejo: true, caras: [dolor2, dolor]}
      - {trazo: [[5.4, -4.4], [7.6, -4.8], [9.6, -4.9]], anchos: [0.1, 0.4, 0.1], material: ojo, espejo: true, caras: [dolor2, dolor]}
      - {trazo: [[3.2, 1.4], [6.8, 2.6], [10.4, 3.8]], anchos: [1.1, 1.1, 0.4], color: '#4a2e1a', espejo: true, caras: [dolor2, dolor]}
      - {contorno: [[-5.0, -9.4], [5.0, -9.4], [4.4, -12.9], [-4.4, -12.9]], suave: false, color: '#4a1f1c', caras: [dolor2, dolor]}
      - {contorno: [[-4.3, -9.85], [4.3, -9.85], [3.85, -12.45], [-3.85, -12.45]], suave: false, color: '#fff4e6', brillo: true, caras: [dolor2, dolor]}
      - {trazo: [[-4.1, -11.15], [4.1, -11.15]], ancho: 0.35, color: '#4a1f1c', brillo: true, caras: [dolor2, dolor]}
      - {trazo: [[-2.2, -9.9], [-2.1, -12.4]], ancho: 0.25, color: '#4a1f1c', brillo: true, caras: [dolor2, dolor]}
      - {trazo: [[0, -9.9], [0, -12.4]], ancho: 0.25, color: '#4a1f1c', brillo: true, caras: [dolor2, dolor]}
      - {trazo: [[2.2, -9.9], [2.1, -12.4]], ancho: 0.25, color: '#4a1f1c', brillo: true, caras: [dolor2, dolor]}
      - {contorno: [[13.8, 3.0], [12.6, 0.0], [13.2, -1.8], [14.6, -1.8], [15.0, 0.0]], color: '#d4ecff', linea: true, brillo: true, caras: [dolor2, dolor]}
      # 3. lágrimas: ojos cerrados ondulados con lágrimas que caen y boca temblorosa
      - {trazo: [[4.4, -2.6], [5.8, -1.8], [7.2, -2.8], [8.6, -1.8], [10.0, -2.6]], anchos: [0.4, 0.9, 1.0, 0.9, 0.4], material: ojo, espejo: true, caras: [dolor3]}
      - {contorno: [[8.6, -3.6], [10.0, -3.6], [10.4, -8.6], [9.3, -10.2], [8.2, -8.6]], color: '#cfe8ff', linea: true, brillo: true, espejo: true, caras: [dolor3]}
      - {trazo: [[3.6, 4.8], [6.8, 3.8], [10.4, 2.2]], anchos: [0.9, 1.0, 0.3], color: '#4a2e1a', espejo: true, caras: [dolor3]}
      - {trazo: [[-3.4, -11.2], [-1.7, -10.3], [0, -11.2], [1.7, -10.3], [3.4, -11.2]], anchos: [0.4, 0.7, 0.7, 0.7, 0.4], color: '#5a1f22', caras: [dolor3]}
      # 4. seria: párpados caídos, mirada baja, mueca contenida y la sombra de la capucha sobre los ojos
      - {ovalo: [2.3, 2.6], centro: [7.2, -3.4], material: ojo, espejo: true, caras: [dolor4]}
      - {contorno: [[3.8, 2.0], [10.8, 2.0], [10.8, -2.2], [3.8, -2.8]], suave: false, material: piel, espejo: true, caras: [dolor4]}
      - {trazo: [[4.4, -2.7], [7.2, -1.9], [10.1, -2.4]], anchos: [0.4, 0.9, 0.3], material: ojo, espejo: true, caras: [dolor4]}
      - {trazo: [[3.8, 3.2], [6.8, 3.1], [10.2, 1.4]], anchos: [0.8, 0.9, 0.3], color: '#4a2e1a', espejo: true, caras: [dolor4]}
      - {trazo: [[-3.0, -11.0], [0, -10.6], [3.0, -11.8]], anchos: [0.3, 0.75, 0.3], color: '#5a1f22', caras: [dolor4]}
      - {ovalo: [16, 7], centro: [0, 3.5], color: '#2a1c22', opacidad: 0.28, blur: 1.6, caras: [dolor4]}
      # 5. aturdido: ojos en blanco, cejas arriba y boca abierta en zigzag
      - {ovalo: [2.7, 3.1], centro: [7.2, -2.4], color: '#fffaf2', linea: true, espejo: true, caras: [dolor5]}
      - {trazo: [[3.6, 5.2], [6.8, 4.6], [10.4, 3.6]], anchos: [0.6, 1.0, 0.3], color: '#4a2e1a', espejo: true, caras: [dolor5]}
      - {contorno: [[-4.0, -9.8], [-2.0, -10.6], [0, -9.8], [2.0, -10.6], [4.0, -9.8], [3.0, -13.0], [0, -13.6], [-3.0, -13.0]], suave: false, color: '#5a1f22', caras: [dolor5]}
      - {trazo: [[10.0, 6.5], [11.5, 8.5]], ancho: 0.45, color: '#4a2e1a', caras: [dolor5]}
      - {trazo: [[12.0, 5.5], [14.0, 7.0]], ancho: 0.45, color: '#4a2e1a', caras: [dolor5]}
      # 6. mueca asimétrica: un ojo apretado con lágrima, el otro abierto, boca abierta y torcida
      - {trazo: [[4.4, -1.8], [7.2, -3.2], [10.2, -2.0]], anchos: [0.6, 1.4, 0.6], material: ojo, caras: [dolor6]}
      - {trazo: [[5.2, 0.0], [7.6, -0.8], [9.8, -0.4]], anchos: [0.1, 0.45, 0.1], material: ojo, caras: [dolor6]}
      - {contorno: [[10.6, -3.4], [9.9, -5.4], [10.4, -6.6], [11.4, -6.6], [11.6, -5.4]], color: '#cfe8ff', linea: true, brillo: true, caras: [dolor6]}
      - {ovalo: [2.6, 3.0], centro: [-7.2, -2.4], color: '#fffaf2', linea: true, caras: [dolor6]}
      - {circulo: 1.05, centro: [-6.9, -2.8], material: ojo, caras: [dolor6]}
      - {trazo: [[3.6, 4.4], [6.8, 3.0], [10.4, 1.4]], anchos: [0.9, 1.0, 0.3], color: '#4a2e1a', espejo: true, caras: [dolor6]}
      - {contorno: [[-4.8, -9.6], [-0.8, -9.0], [4.2, -10.3], [3.2, -14.0], [-0.5, -14.6], [-3.8, -13.0]], color: '#5a1f22', caras: [dolor6]}
      - {contorno: [[-4.0, -9.75], [-0.8, -9.3], [3.7, -10.4], [3.5, -11.3], [-0.8, -10.5], [-3.9, -10.8]], color: '#fff4e6', brillo: true, caras: [dolor6]}
      # decidido: cejas fruncidas
      - {trazo: [[3.6, 1.4], [6.8, 2.2], [10.4, 3.4]], anchos: [0.6, 1.0, 0.3], color: '#4a2e1a', espejo: true, caras: [decidido]}
      - {ovalo: [2.8, 1.5], centro: [11, -8], color: '#e98a74', opacidad: 0.45, blur: 0.6, espejo: true, sin_caras: [dolor, dolor1, dolor2, dolor3, dolor4, dolor5, dolor6]}
      - {trazo: [[-1.6, -10.4], [0, -11.0], [1.6, -10.4]], anchos: [0.25, 0.7, 0.25], color: '#7a3f30', caras: [normal, parpadeo, decidido]}
      - {contorno: [[-2.2, -9.8], [2.2, -9.8], [1.4, -12.4], [-1.4, -12.4]], color: '#6a2c26', caras: [dolor]}

  # ------------------------------------------------------------------ capucha: cubre la cabeza y deja ver la cara
  - nombre: capucha
    hueso: cabeza
    forma: elipsoide
    pos: [0, 2.6, -2.2]
    r: [22.0, 22.2, 22.6]
    material: capa
    grupo: capucha
    capa: 10
    calcas:
      - op: resta
        contorno: [[-15.8, -26], [-16.8, -10], [-16.6, 1], [-13.8, 9.2], [-7.6, 13.6], [0, 14.9], [7.6, 13.6], [13.8, 9.2], [16.6, 1], [16.8, -10], [15.8, -26]]
      # el borde de la capucha tiene grosor: una banda más oscura justo afuera del hueco
      - {trazo: [[-16.5, -11], [-16.4, 1], [-13.6, 9.5], [-7.5, 13.9], [0, 15.2], [7.5, 13.9], [13.6, 9.5], [16.4, 1], [16.5, -11]], anchos: [0.5, 1.6, 2.0, 2.0, 2.0, 2.0, 2.0, 1.6, 0.5], color: '#1d2619'}
  - nombre: caida_capucha
    hueso: cabeza
    forma: casco
    esferas: [[-15.5, -9, -3, 5.5], [15.5, -9, -3, 5.5], [0, -11, -13, 6.5], [torso, -11.5, 22, -1, 5.0], [torso, 11.5, 22, -1, 5.0], [torso, 0, 23, -6.5, 5.5]]
    material: capa
    capa: -3
  - nombre: punta_capucha
    hueso: capucha1
    forma: tubo
    puntos: [[capucha1, 0, 3, 3, 7.0], [capucha2, 0, 0, 0, 4.4], [capucha3, 0, 0, 0, 1.8], [capucha3, 0, -4.5, -0.8, 0.2]]
    material: capa

  # ------------------------------------------------------------------ pelo café que asoma bajo la capucha
  - nombre: flequillo
    hueso: cabeza
    forma: mechones
    pos: [0, 1.0, 0]
    sobre: [19.2, 18.8, 18.4]
    material: pelo
    grupo: pelo
    capa: -10
    lista:
      - {en: [-12.5, 13], hacia: -100, curva: 16, largo: 9, ancho: 3.4, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [-6, 15], hacia: -92, curva: 10, largo: 10, ancho: 3.8, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [1, 15.5], hacia: -86, curva: -12, largo: 9.5, ancho: 3.8, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [7.5, 14.5], hacia: -78, curva: -16, largo: 9, ancho: 3.6, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [13, 12], hacia: -74, curva: -14, largo: 8, ancho: 3.2, perfil: [1, 0.8, 0.05], alza: [0.6, 0.6]}
      - {en: [-15.5, 6], hacia: -96, curva: 10, largo: 12, ancho: 2.8, perfil: [1, 0.85, 0.05], alza: [0.7, 0.9]}
      - {en: [15.5, 6], hacia: -84, curva: -10, largo: 12, ancho: 2.8, perfil: [1, 0.85, 0.05], alza: [0.7, 0.9]}

  # ------------------------------------------------------------------ bufanda color arena
  - nombre: bufanda_atras
    hueso: cuello
    forma: tubo
    puntos: [[-8.4, 0, 0], [-6.0, 0.6, -6], [0, 1.0, -8.0], [6.0, 0.6, -6], [8.4, 0, 0]]
    radio: 3.8
    material: bufanda
  - nombre: bufanda
    hueso: cuello
    forma: tubo
    puntos: [[8.6, 0, 0], [6.8, -0.8, 5.8], [0, -1.8, 8.6], [-6.8, -0.8, 6.0], [-8.6, 0, 0]]
    radio: 3.9
    material: bufanda
    capa: 8
    trazos:
      - {puntos: [[6.5, 2.5, 8.2], [0, 1.0, 12.4], [-6.5, 2.3, 8.6]], anchos: [0, 0.5, 0], tono: hondo, normal: [0, 0, 1]}
  - nombre: bufanda_vuelta
    hueso: cuello
    forma: tubo
    puntos: [[9.4, -4, 1], [7.0, -5.8, 7.2], [0, -7.0, 9.8], [-7.0, -6.0, 7.6], [-9.4, -4, 1]]
    radio: 3.2
    material: bufanda
    capa: 7.5
    trazos:
      - {puntos: [[5, -5.4, 11], [0, -6.4, 13.6], [-5, -5.6, 11.4]], anchos: [0, 0.45, 0], tono: hondo, normal: [0, 0, 1]}
  - nombre: cola_bufanda
    hueso: cuello
    forma: cinta
    puntos: [[-5.5, -7, 10], [torso, -7.0, 12, 10.5], [torso, -7.6, 4, 11.2]]
    ancho: 5.0
    normal: [0, 0, 1]
    cola: v
    material: bufanda
    capa: 8.5
    trazos:
      - {puntos: [[-5.5, -7, 10.3], [torso, -7.0, 11, 10.8], [torso, -7.5, 5.5, 11.4]], anchos: [0, 0.35, 0], tono: hondo}

  # ------------------------------------------------------------------ manto corto sobre los hombros, deshilachado
  - nombre: manto
    hueso: capa
    forma: campana
    aros: [[3, 9, 7.5], [-2, 15.5, 11.5], [-12, 19.5, 14]]
    ondas: 11
    puntas: true
    caidas: [3.5, 2.2, 4.2, 2.8, 3.8, 2.0, 4.5, 2.6, 3.4, 2.4, 4.0]
    redondeo: 1.6
    material: capa
    capa: 7
    trazos:
      - {puntos: [[-4, 2, 8.5], [-7.5, -5, 12.5], [-10, -12, 14.2]], anchos: [0, 0.5, 0], tono: hondo, normal: [0, 0, 1]}
      - {puntos: [[5, 1.5, 8.5], [9, -5, 12], [12, -12, 13.5]], anchos: [0, 0.45, 0], tono: hondo, normal: [0.3, 0, 1]}

  # ------------------------------------------------------------------ capa larga abierta adelante, ruedo deshilachado
  - nombre: capa_larga
    hueso: capa
    forma: campana
    aros: [[0, 9.5, 7.5], [-6, 14.5, 10.5], [-20, 18, 12.5], [-40, 21.5, 14.5], [-60, 24.5, 16.5]]
    ondas: 18
    fase: 10
    abertura: 64
    puntas: true
    caidas: [2.5, 1.5, 3.2, 2.0, 2.8, 1.4, 3.6, 2.2, 2.6, 1.8, 3.0, 1.6, 3.4, 2.0, 2.4, 1.5, 3.1, 2.2]
    redondeo: 1.4
    material: capa
    reverso: forro
    capa: 6
    capa_atras: -18
    trazos:
      - {puntos: [[14, -14, 6], [17.5, -34, 7], [20.5, -57, 7.5]], anchos: [0, 0.5, 0.1], tono: hondo, normal: [0.8, 0, 0.6]}
      - {puntos: [[-14, -14, 6], [-17.5, -34, 7], [-20.5, -57, 7.5]], anchos: [0, 0.5, 0.1], tono: hondo, normal: [-0.8, 0, 0.6]}

  # ------------------------------------------------------------------ túnica, cinturón, bolsa y morral
  - nombre: tunica
    hueso: torso
    forma: casco
    esferas: [[-7.5, 19, 0, 5], [7.5, 19, 0, 5], [0, 20, 1, 5.5], [-6, 9, 1, 6], [6, 9, 1, 6], [0, 10, 2.5, 6.2], [-5.5, 0, 0, 5.8], [5.5, 0, 0, 5.8], [0, 0, 1.8, 5.8]]
    material: tunica
    trazos:
      - {puntos: [[0.5, 21, 6.6], [0.8, 14, 8.6], [0.6, 6, 8.2]], anchos: [0.2, 0.45, 0.2], tono: linea, normal: [0, 0, 1]}
  - nombre: faldon
    hueso: cadera
    forma: casco
    esferas: [[-6, 2, 0, 5.5], [6, 2, 0, 5.5], [0, 2, 2, 5.5], [-8.5, -15, 1, 1.2], [8.5, -15, 1, 1.2], [0, -16, 4.5, 1.2], [0, -14, -4, 1.2], [-6, -15.5, 4, 1.2], [6, -15.5, 4, 1.2]]
    material: tunica
    trazos:
      - {puntos: [[0.5, -4, 7.4], [0.6, -10, 6.4], [0.4, -15.5, 4.8]], anchos: [0.4, 0.5, 0.4], tono: linea, normal: [0, 0, 1]}
      - {puntos: [[-5.5, -14.2, 4.6], [0, -15.0, 5.6], [5.5, -14.2, 4.6]], ancho: 0.25, guiones: [0.7, 0.6], tono: luz, normal: [0, 0, 1]}
  - nombre: cinturon
    hueso: torso
    forma: tubo
    puntos: [[-11.4, 0.5, 0], [-8.2, 0.5, 5.2], [0, 0.6, 7.8], [8.2, 0.5, 5.2], [11.4, 0.5, 0]]
    radio: 1.5
    material: cuero
    capa: 0.5
  - {nombre: hebilla, hueso: torso, forma: lamina, pos: [-2.5, 0.6, 9.0], rot: [0, -8, 0], rect: [3.2, 3.0], radio: 0.5, agujeros: [{rect: [1.6, 1.4]}], material: laton, una_cara: true, capa: 0.8, grosor: 0.7}
  - {nombre: bolsa, hueso: torso, forma: caja, pos: [6.5, -3.0, 6.4], rot: [0, 28, 0], tam: [4.6, 5.4, 2.8], radio: 1.0, material: cuero, capa: 1.0}
  - {nombre: tapa_bolsa, hueso: torso, forma: lamina, pos: [6.9, -1.6, 7.9], rot: [0, 28, 0], contorno: [[-2.4, 1.4], [2.4, 1.4], [2.2, -1.2], [0, -2.0], [-2.2, -1.2]], material: cuero, una_cara: true, capa: 1.2, grosor: 0.6}
  - nombre: correa
    hueso: torso
    forma: cinta
    puntos: [[cadera, -9, 0, 4.5], [torso, -5, 7, 8.4], [torso, 3.5, 15, 8.0], [torso, 9.0, 21, 3.0], [torso, 9.8, 23, -1]]
    ancho: 2.2
    normal: [0, 0, 1]
    material: cuero
    capa: 1.5
  - {nombre: morral, hueso: cadera, forma: caja, pos: [-11.5, -5, 3], rot: [0, -60, 4], tam: [9, 8, 3.4], radio: 1.4, material: cuero, capa: 1.6,
     trazos: [{puntos: [[-4, 2.6, 1.8], [0, 1.4, 1.9], [4, 2.6, 1.8]], ancho: 0.3, tono: hondo}]}

  # ------------------------------------------------------------------ brazos con mangas y antebrazos vendados
  # El brazo del bastón (derecho) va por fuera de la capa larga: solo el manto le tapa el hombro.
  - nombre: manga
    hueso: hombro
    forma: tubo
    puntos: [[0, 1.5, 0, 3.8], [codo, 0, 0, 0, 3.3], [codo, 0, -3, 0, 3.2]]
    material: tunica
    fuera_de: [capa_larga, manto]
    lados: {d: {fuera_de: [manto]}}
    capa: 12
  - nombre: venda
    hueso: codo
    forma: tubo
    puntos: [[0, -2.5, 0, 3.3], [mano, 0, 2.2, 0, 3.0]]
    material: venda
    fuera_de: [capa_larga, manto]
    lados: {d: {fuera_de: [manto]}}
    capa: 12.2
    trazos:
      - {puntos: [[-3.3, -4.5, 0.5], [0, -5.8, 3.4], [3.3, -4.5, 0.5]], ancho: 0.35, tono: hondo}
      - {puntos: [[-3.2, -7.5, 0.5], [0, -8.8, 3.3], [3.2, -7.5, 0.5]], ancho: 0.35, tono: hondo}
  - nombre: mano
    hueso: mano
    forma: casco
    esferas: [[0, -0.5, 0, 2.8], [0, -4.0, 0.4, 2.7], [0.5, -6.2, 0.8, 2.1]]
    material: piel
    fuera_de: [capa_larga, manto]
    lados: {d: {fuera_de: [manto]}}
    capa: 12.4
  - {nombre: pulgar, hueso: mano, forma: tubo, puntos: [[0, -1.5, 2.2, 1.2], [0.2, -3.8, 3.6, 1.0]], material: piel, fuera_de: [capa_larga, manto], lados: {d: {fuera_de: [manto]}}, capa: 12.6}

  # ------------------------------------------------------------------ piernas y botas vendadas
  - nombre: pierna
    hueso: pierna
    forma: tubo
    puntos: [[0, 1, 0, 4.3], [rodilla, 0, 0, 0.3, 3.8], [rodilla, 0, -6, 0.2, 3.6]]
    material: pantalon
    capa: -3
  - nombre: cana
    hueso: rodilla
    forma: tubo
    puntos: [[0, -5, 0.2, 4.0], [pie, 0, 2, 0, 3.8]]
    material: bota
    capa: -2.5
    trazos:
      - {puntos: [[-4.1, -8, 0.8], [0, -9.2, 4.2], [4.1, -8, 0.8]], ancho: 1.1, tono: '#cfbd96'}
      - {puntos: [[-4.0, -12, 0.8], [0, -13.0, 4.1], [4.0, -12, 0.8]], ancho: 1.1, tono: '#cfbd96'}
      - {puntos: [[-3.9, -16, 0.8], [0, -16.6, 4.0], [3.9, -16, 0.8]], ancho: 1.1, tono: '#cfbd96'}
  - nombre: bota
    hueso: pie
    forma: casco
    esferas: [[0, 1.0, 0, 3.9], [0, -2.0, -1.2, 3.4], [0, -2.2, 4.8, 2.9], [0, -1.2, 2.2, 3.4]]
    material: bota
    capa: -2
    trazos:
      - {puntos: [[-3.0, -4.6, -2.6], [-3.1, -4.6, 2.0], [-2.7, -4.6, 6.6]], ancho: 0.7, tono: hondo}

  # ------------------------------------------------------------------ bastón de caminante con un trapo atado
  - nombre: vara
    hueso: baculo
    forma: tubo
    puntos: [[0, -46, 0, 1.1], [0.5, -10, 0.2, 1.2], [-0.4, 20, 0, 1.25], [0.9, 40, 0.5, 1.4], [0, 50, 0, 1.5]]
    material: madera
    capa: 20
    trazos:
      - {puntos: [[0.6, 24, 1.2], [0.8, 34, 1.3]], anchos: [0, 0.3, 0], tono: hondo}
      - {puntos: [[-0.4, -20, 1.1], [-0.2, -4, 1.2]], anchos: [0, 0.3, 0], tono: hondo}
  - {nombre: nudo, hueso: baculo, forma: elipsoide, pos: [0.2, 51.5, 0], r: [2.3, 2.6, 2.3], material: madera, capa: 20.1}
  - {nombre: atadura, hueso: baculo, forma: cilindro, a: [0.8, 45, 0.4], b: [0.8, 48.5, 0.4], r: 1.7, material: venda, capa: 20.2,
     trazos: [{puntos: [[-0.9, 45.8, 2.0], [2.5, 46.8, 1.6]], ancho: 0.3, tono: hondo}, {puntos: [[-0.9, 47.2, 2.0], [2.5, 48.2, 1.6]], ancho: 0.3, tono: hondo}]}
  - nombre: trapo
    hueso: trapo1
    forma: cinta
    puntos: [[trapo1, 0, 0, 0], [trapo2, 0, 0, 0], [trapo3, 0, 0, 0], [trapo3, 0.3, -5, 0.4]]
    anchos: [2.6, 2.4, 2.2]
    normal: [0, 0, 1]
    cola: v
    material: venda
    capa: 20.3
  - {nombre: cordel, hueso: baculo, forma: tubo, puntos: [[-1.2, 46, 0.6, 0.25], [-2.2, 42, 0.8, 0.25], [-2.4, 39, 1.0, 0.25]], material: cuero, capa: 20.2}
  - {nombre: amuleto, hueso: baculo, forma: lamina, pos: [-2.4, 35.5, 1.2], rot: [0, -30, 8], contorno: [[0, 3.5], [-1.2, 1.5], [-1.4, -2], [0, -4.5], [1.3, -2], [1.2, 1.5]], material: pluma, capa: 20.4, grosor: 0.6,
     trazos: [{puntos: [[0, 3.5, 0.05], [0, -4.2, 0.05]], anchos: [0.3, 0.1], tono: hondo}]}

fisica:
  gravedad: 600
  pasos: 8
  iteraciones: 5
  viento: {dir: [-1, 0, -0.5], fuerza: 900, rafaga: 0.7, ciclos: 1}
  colisiones:
    - {nombre: torso, hueso: torso, a: [5, 0, 0.5], b: [5.5, 18, 0], r: 6.5, espejo: true}
    - {nombre: cabeza, hueso: cabeza, a: [0, 2.6, -2.2], r: 21.5}
    - {nombre: brazo, hueso: hombro, a: [0, 0, 0], b: [codo, 0, 0, 0], r: 3.8, espejo: true}
    - {nombre: antebrazo, hueso: codo, a: [0, 0, 0], b: [mano, 0, 0, 0], r: 3.3, espejo: true}
    - {nombre: muslo, hueso: pierna, a: [0, 0, 0], b: [rodilla, 0, 0, 0], r: 4.4, espejo: true}
    - {nombre: cana, hueso: rodilla, a: [0, 0, 0], b: [pie, 0, 0, 0], r: 4.0, espejo: true}
    - {nombre: baculo, hueso: baculo, a: [0, -46, 0], b: [0, 50, 0], r: 1.4}
  telas:
    # el manto corto se apoya en los hombros: si sube un brazo, lo levanta
    - {pieza: manto, rigidez: 0.012, amortiguar: 0.05, viento: 0.6, choca: [torso.i, torso.d, brazo.i, brazo.d, antebrazo.d]}
    - {pieza: capa_larga, rigidez: 0.02, amortiguar: 0.04, choca: [torso.i, torso.d, brazo.i, antebrazo.i, muslo.i, muslo.d, cana.i, cana.d]}
  cadenas:
    - {nombre: capucha, huesos: [capucha1, capucha2, capucha3], punta: [0, -4.5, -0.8], rigidez: 0.06, amortiguar: 0.08, choca: [cabeza, torso.i, torso.d], grosor: 1.0}
    - {nombre: trapo, huesos: [trapo1, trapo2, trapo3], punta: [0.3, -5, 0.4], rigidez: 0.012, amortiguar: 0.03, viento: 1.4, choca: [baculo], grosor: 0.8}

animaciones:
  # Solo se anima el cuerpo. La ropa (capa, manto, punta de la capucha y trapo del bastón) la mueve la física.
  # Las claves usan curvas: salida (frena), entrada (acelera), sobrepaso (se pasa y vuelve).
  reposo:
    cuadros: 32
    fps: 20
    caras: [{desde: 0.62, hasta: 0.68, cara: parpadeo}]
    pose:
      cadera: [0, 0, '1.2*sin(tau*t)']
      torso: {rot: ['1.5*sin(tau*t)', 0, '-1.0*sin(tau*t)'], pos: [0, '0.5*sin(tau*t)', 0]}
      cabeza: ['-2*sin(tau*t + 0.7)', '4*sin(tau*t - 0.3)', '1.5*sin(tau*t + 0.3)']
      hombro.d: ['2.5*sin(tau*t + 0.4)', 0, '1.5*sin(tau*t)']

  caminar:
    cuadros: 16
    fps: 20
    pose:
      raiz: {pos: [0, '1.6*abs(cos(tau*t))', 0]}
      cadera: [0, '6*sin(tau*t)', '2*cos(tau*t)']
      pierna.i: ['26*sin(tau*t)', 0, 0]
      pierna.d: ['-26*sin(tau*t)', 0, 0]
      rodilla.i: ['6 + 24*max(0, -cos(tau*t))', 0, 0]
      rodilla.d: ['6 + 24*max(0, cos(tau*t))', 0, 0]
      pie.i: ['-8*max(0, -cos(tau*t)) + 6*sin(tau*t)', 0, 0]
      pie.d: ['-8*max(0, cos(tau*t)) - 6*sin(tau*t)', 0, 0]
      torso: [5, '-7*sin(tau*t)', '-1.5*cos(tau*t)']
      cabeza: ['-1.5*abs(cos(tau*t))', '4*sin(tau*t)', '1.5*cos(tau*t)']
      hombro.d: ['-10*sin(tau*t)', 0, 0]

  ataque:
    cuadros: 28
    fps: 24
    bucle: false
    claves:
      - {t: 0, pose: {}}
      # preparación: se agacha y alza el bastón por delante, sobre su hombro derecho (el brazo siempre a la vista)
      - t: 0.22
        curva: salida
        cara: decidido
        apunta: {baculo: {hacia: [-0.3, 0.88, -0.36], frente: [-0.6, 0, 0.8]}}
        pose:
          cadera: {pos: [0, -2.6, -1.5]}
          torso: [-6, -14, 0]
          cabeza: [6, 10, 0]
          hombro.d: [-128, -5, -90]
          codo.d: [-8, 0, 0]
          pierna.d: [-12, 0, 0]
          pierna.i: [8, 0, 0]
          rodilla.i: [14, 0, 0]
          rodilla.d: [10, 0, 0]
      - t: 0.3
        curva: suave
        cara: decidido
        apunta: {baculo: {hacia: [-0.25, 0.82, -0.52], frente: [-0.6, 0, 0.8]}}
        pose:
          cadera: {pos: [0, -2.9, -1.6]}
          torso: [-7, -16, 0]
          cabeza: [6, 11, 0]
          hombro.d: [-135, -15, -90]
          codo.d: [0, 0, 0]
          pierna.d: [-12, 0, 0]
          pierna.i: [8, 0, 0]
          rodilla.i: [15, 0, 0]
          rodilla.d: [11, 0, 0]
      # golpe: paso adelante y el bastón baja de frente, acelerando
      - t: 0.42
        curva: entrada
        cara: decidido
        apunta: {baculo: {hacia: [0.5, -0.35, 0.8], frente: [-0.5, 0.3, 0.8]}}
        pose:
          raiz: {pos: [0, 0, 7]}
          cadera: {pos: [0, -3.6, 0]}
          torso: [16, 24, 0]
          cabeza: [-6, -8, 0]
          hombro.d: [-45, 0, 30]
          codo.d: [20, 0, 0]
          pierna.d: [24, 0, 0]
          pierna.i: [-20, 0, 0]
          rodilla.d: [22, 0, 0]
          rodilla.i: [6, 0, 0]
      # el bastón se pasa un poco y se asienta
      - t: 0.5
        curva: sobrepaso
        cara: decidido
        apunta: {baculo: {hacia: [0.36, -0.62, 0.7], frente: [-0.5, 0.3, 0.8]}}
        pose:
          raiz: {pos: [0, 0, 7.5]}
          cadera: {pos: [0, -3.8, 0]}
          torso: [19, 28, 0]
          cabeza: [-5, -10, 0]
          hombro.d: [-40, 0, 30]
          codo.d: [24, 0, 0]
          pierna.d: [24, 0, 0]
          pierna.i: [-20, 0, 0]
          rodilla.d: [22, 0, 0]
          rodilla.i: [6, 0, 0]
      # recupera: lleva el bastón hacia afuera, a su costado, y de ahí lo para (no cruza la cara)
      - t: 0.7
        curva: suave
        cara: normal
        apunta: {baculo: {hacia: [-0.85, 0.45, 0.25], frente: [-0.5, 0, 0.85]}}
        pose:
          raiz: {pos: [0, 0, 3]}
          cadera: {pos: [0, -1.5, 0]}
          torso: [6, 6, 0]
          cabeza: [-1, -3, 0]
          hombro.d: [-10, 0, 30]
          codo.d: [-10, 0, 0]
          pierna.d: [8, 0, 0]
          pierna.i: [-6, 0, 0]
      - {t: 1, curva: sobrepaso, pose: {}}

  golpe:
    cuadros: 18
    fps: 24
    bucle: false
    claves:
      - {t: 0, pose: {}}
      # lo empujan: sale despedido hacia atrás
      - t: 0.05
        curva: lineal
        cara: dolor
        pose:
          raiz: {pos: [-2, 1.2, -3]}
          torso: [-10, -5, 4]
          cabeza: [2, -6, 5]
      - t: 0.12
        curva: salida
        cara: dolor
        pose:
          raiz: {pos: [-4, 2.5, -6]}
          torso: [-16, -10, 8]
          cabeza: [5, -14, 10]
          hombro.d: [30, 0, 26]
          codo.d: [-20, 0, 0]
          pierna.d: [-14, 0, 0]
          pierna.i: [-8, 0, 0]
      # aterriza doblando las rodillas
      - t: 0.26
        curva: salida
        cara: dolor
        pose:
          raiz: {pos: [-8, 0, -10]}
          cadera: {pos: [0, -3.5, 0]}
          torso: [-4, -6, 4]
          cabeza: [4, -8, 6]
          hombro.d: [12, 0, 14]
          rodilla.i: [22, 0, 0]
          rodilla.d: [18, 0, 0]
      # sacude la cabeza
      - t: 0.42
        cara: dolor
        pose:
          raiz: {pos: [-8, 0, -10]}
          cadera: {pos: [0, -2, 0]}
          torso: [-2, 0, 0]
          cabeza: [3, 12, -5]
          rodilla.i: [10, 0, 0]
          rodilla.d: [8, 0, 0]
      - t: 0.56
        cara: dolor
        pose:
          raiz: {pos: [-8, 0, -10]}
          cadera: {pos: [0, -1.6, 0]}
          torso: [-1, 0, 0]
          cabeza: [2, -10, 4]
          rodilla.i: [8, 0, 0]
          rodilla.d: [6, 0, 0]
      # se recompone
      - t: 0.74
        cara: decidido
        pose:
          raiz: {pos: [-4, 0, -5]}
          cadera: {pos: [0, -1, 0]}
          torso: [2, 4, 0]
      - {t: 1, curva: sobrepaso, cara: normal, pose: {}}
