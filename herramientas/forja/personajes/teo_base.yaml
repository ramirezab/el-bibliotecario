# Personaje base dibujado por el autor del juego (arte/referencias/personaje_base.png), armado en piezas para
# poder girarlo y animarlo. Es la línea de arte del juego: cabeza redonda grande, ojos ovalados sin boca,
# capa de campana con cuello grueso, botas cortas, líneas del color oscuro de cada pieza, sombra casi plana.
# Unidades: 1 = 4 px, la misma escala del dibujo original (corrido 62, 18 px para compararlos encima).
nombre: Teo_base
estilo: pluma
lienzo: [480, 700]
origen: [240, 556]
escala: 4
camara: {yaw: 0, pitch: 8}
luz: [-0.6, 0.55, 0.6]
tinta: '#312a0e'
grosor: 0.8
grosor_silueta: 0
linea_encima: true
peso_sombra: 0.3
sombra_proyectada: 1.2
grano: 0.06
fondo_revision: papel

materiales:
  piel: {color: '#fcd7a0', linea: '#c2a47c', sin_sombra: true, sin_grano: true}
  ojo: {color: '#493918'}
  pelo: {color: '#886632', sombra: '#5f4626', hondo: '#4a361c', linea: '#3e2d14', ancho_sombra: 0.45, suave: 1.8, borde_suave: [0.9, 0.35]}
  capa: {color: '#5a4b24', sombra: '#483c19', hondo: '#3a3013', linea: '#312a0e', ancho_sombra: 0.26, suave: 3.0, borde_suave: [1.8, 0.65]}
  cuello: {color: '#5a4c26', sombra: '#453916', hondo: '#3a3013', linea: '#312a0e', ancho_sombra: 0.35, suave: 2.0, borde_suave: [1.4, 0.6]}
  bota: {color: '#64471f', sombra: '#4b3417', hondo: '#3b2a14', linea: '#3a2c18', ancho_sombra: 0.3, suave: 1.5, borde_suave: [1.0, 0.5]}

huesos:
  - {nombre: raiz}
  - {nombre: cadera, padre: raiz, pos: [0, 28, 0]}
  - {nombre: torso, padre: cadera, pos: [0, 0, 0]}
  - {nombre: cuello, padre: torso, pos: [0, 42, 0]}
  - {nombre: cabeza, padre: cuello, pos: [0.3, 28.6, 0], rot: [0, -10, 0]}
  - {nombre: pierna, padre: cadera, pos: [8.6, 0, 0], espejo: true}
  - {nombre: pie, padre: pierna, pos: [0, -23.5, 0], rot: [0, 62, 0]}
  - {nombre: hombro, padre: torso, pos: [9, 31, 0], rot: [0, 0, 8], espejo: true}
  - {nombre: codo, padre: hombro, pos: [0, -11, 0]}
  - {nombre: mano, padre: codo, pos: [0, -10, 0]}

piezas:
  # ------------------------------------------------------------------ cabeza
  - nombre: cabeza
    hueso: cabeza
    forma: elipsoide
    r: [20.5, 19, 19]
    material: piel
    grosor: 0.7
    calcas:
      - {ovalo: [2.1, 3.2], centro: [8.7, -0.7], material: ojo, espejo: true, caras: [normal, decidido]}
      # decidido: el párpado de arriba baja en diagonal
      - {contorno: [[5.5, 3.5], [12.5, 3.5], [12.5, 1.4], [5.5, 0.0]], suave: false, material: piel, espejo: true, caras: [decidido]}
      - {trazo: [[6.6, -1.6], [8.7, -2.2], [10.8, -1.6]], anchos: [0.3, 0.9, 0.3], material: ojo, espejo: true, caras: [parpadeo]}
      - {trazo: [[10.4, 1.4], [7.0, -0.8], [10.4, -3.0]], anchos: [0.4, 1.0, 0.4], suave: false, material: ojo, espejo: true, caras: [dolor]}

  # ------------------------------------------------------------------ pelo
  - nombre: casquete
    hueso: cabeza
    forma: elipsoide
    pos: [0, 2.0, -0.6]
    r: [21.6, 20.8, 20.2]
    material: pelo
    grupo: pelo
    capa: 3
    calcas:
      - op: resta
        suave: false
        contorno: [[-26, -2], [-21, 3.5], [-15.5, 7.0], [-8, 8.0], [0, 7.4], [8, 8.0], [13.5, 7.2], [17.5, 3.5], [19.5, -4], [24, -7], [26, -40], [-26, -40]]
  - nombre: mechones
    hueso: cabeza
    forma: mechones
    pos: [0, 2.0, -0.6]
    sobre: [21.6, 20.8, 20.2]
    material: pelo
    grupo: pelo
    capa: 3
    lista:
      # flequillo: puntas grandes sobre la frente
      - {en: [-18, 10], hacia: -106, curva: 16, largo: 8.5, ancho: 3.8, perfil: [1, 0.75, 0.05], alza: [0.3, 0.5]}
      - {en: [-10.5, 11.5], hacia: -96, curva: 10, largo: 8.5, ancho: 4.0, perfil: [1, 0.75, 0.05], alza: [0.3, 0.5]}
      - {en: [-2.5, 11.5], hacia: -86, curva: -8, largo: 8.0, ancho: 4.0, perfil: [1, 0.75, 0.05], alza: [0.3, 0.5]}
      - {en: [5.5, 11.5], hacia: -80, curva: -10, largo: 8.4, ancho: 3.9, perfil: [1, 0.75, 0.05], alza: [0.3, 0.5]}
      - {en: [11.5, 10.5], hacia: -72, curva: -14, largo: 7.4, ancho: 3.5, perfil: [1, 0.75, 0.05], alza: [0.3, 0.5]}
      # sien izquierda y volumen de los costados
      - {en: [-20.5, 5], hacia: -96, curva: 8, largo: 8, ancho: 3.0, perfil: [1, 0.8, 0.05], alza: [0.5, 0.8]}
      - {en: [-19.5, 14], hacia: -100, curva: 6, largo: 11, ancho: 3.4, perfil: [1, 0.95, 0.2], alza: [0.7, 0.8]}
      # mechón ancho del costado que baja hasta la mejilla
      - {en: [17.0, 10], hacia: -98, curva: 30, largo: 21, ancho: 5.2, perfil: [1, 1, 0.85, 0.05], alza: [1.0, 1.4]}
      # remolino de arriba
      - {en: [8.5, 18.5], dir: [0.4, 1, -0.15], doblez: [0.8, -0.4, 0], largo: 6.5, ancho: 2.0, perfil: [1, 1.05, 0.25]}
      - {en: [12.5, 16.5], dir: [1, 0.6, -0.1], doblez: [0.3, -0.7, 0], largo: 5.2, ancho: 1.7, perfil: [1, 1, 0.25]}

  # ------------------------------------------------------------------ cuello grueso de la capa
  - nombre: cuello_atras
    hueso: cuello
    forma: tubo
    puntos: [[-15, 3, 0], [-10.5, 4, -7.5], [0, 4.6, -10.5], [10.5, 4, -7.5], [15, 3, 0]]
    radio: 6.8
    material: cuello
  - nombre: cuello
    hueso: cuello
    forma: tubo
    puntos: [[15.4, 3, 0], [11.5, 2.4, 7.4], [1, 2.0, 10.5], [-10, 2.4, 8], [-15.4, 3, 0]]
    radio: 6.8
    material: cuello
    grupo: cuello
    capa: -10
    trazos:
      - {puntos: [[-15, -1, 8], [-6, -4.5, 14.5], [6, -4.4, 14.8], [15, -1, 8.5]], anchos: [0, 0.75, 0.75, 0], tono: linea, normal: [0, 0, 1]}
      - {puntos: [[-9, 4, 14.5], [-2, 3, 16.5], [4, 3.4, 16.2]], anchos: [0, 0.55, 0], tono: linea, normal: [0, 0, 1]}
  - nombre: bulto_cuello
    hueso: cuello
    forma: tubo
    puntos: [[-13, -1, 9.5], [-17.5, -6, 6.5], [-19.5, -11, 2.5]]
    radios: [6.4, 5.8, 4.0]
    material: cuello
    grupo: cuello
    capa: -10
  - nombre: cuello_bajo
    hueso: cuello
    forma: tubo
    puntos: [[-20, -3, 1], [-13, -6.5, 9.5], [0, -8.2, 12.2], [13, -6.5, 9.5], [20.5, -3, 1]]
    radios: [5.0, 5.8, 6.2, 5.8, 5.0]
    material: cuello
    grupo: cuello
    capa: -10
    trazos:
      - {puntos: [[-17, -8, 9], [-10, -11.5, 13.5], [-3, -12.6, 15]], anchos: [0, 0.6, 0], tono: linea, normal: [0, 0, 1]}
      - {puntos: [[8, -11, 14.5], [14, -9, 12], [19, -6, 7]], anchos: [0, 0.6, 0], tono: linea, normal: [0.4, 0, 1]}

  # ------------------------------------------------------------------ capa de campana
  - nombre: capa
    hueso: torso
    forma: campana
    aros: [[36, 12, 9], [30, 19, 13], [18, 26.5, 18], [0, 32.5, 22]]
    ondas: 9
    fase: -8
    caida: 2.2
    redondeo: 1.5
    pliegues: true
    alto_pliegue: 0.35
    material: capa
    capa: -6
    trazos:
      - {puntos: [[-11, 33, 13], [-12.2, 18, 19.5], [-13, 1, 22]], anchos: [0.1, 0.75, 0.6], tono: linea, normal: [0, 0, 1]}
      - {puntos: [[14, 22, 15.5], [16, 12, 17.5], [17.5, 2, 19.5]], anchos: [0, 0.5, 0.2], tono: linea, normal: [0.4, 0, 1]}

  # ------------------------------------------------------------------ brazos: viven bajo la capa y salen al atacar
  - nombre: manga
    hueso: hombro
    forma: tubo
    puntos: [[0, 0, 0, 4.0], [codo, 0, 0, 0, 3.6], [mano, 0, 2.0, 0, 3.8]]
    material: capa
    fuera_de: capa
  - nombre: mano
    hueso: mano
    forma: casco
    esferas: [[0, -0.5, 0, 2.6], [0, -3.4, 0.4, 2.5], [0.4, -5.2, 0.8, 1.8]]
    material: piel
    fuera_de: capa
    capa: 0.5

  # ------------------------------------------------------------------ botas
  - nombre: bota
    hueso: pierna
    forma: tubo
    puntos: [[0, 0, 0, 5.4], [pie, 0, 1.5, 0, 5.2]]
    material: bota
    fuera_de: capa
    capa: -8
  - nombre: pie
    hueso: pie
    forma: casco
    esferas: [[0, 0.8, 0, 5.2], [0, -1.6, -2.2, 3.6], [0, -1.4, 4.5, 3.8], [0, -1.6, 9.5, 3.4], [0, -0.6, 10.5, 2.6]]
    material: bota
    capa: -7

animaciones:
  reposo:
    cuadros: 8
    fps: 8
    caras: [{desde: 0.75, hasta: 0.875, cara: parpadeo}]
    pose:
      torso: {rot: [0, 0, '0.6*sin(tau*t)'], pos: [0, '0.35*sin(tau*t)', 0]}
      cuello: ['0.8*sin(tau*t + 0.5)', 0, 0]
      cabeza: ['-1.2*sin(tau*t + 0.9)', 0, '1.0*sin(tau*t)']

  caminar:
    cuadros: 8
    fps: 10
    pose:
      raiz: {pos: [0, '0.9*abs(sin(tau*t))', 0]}
      pierna.i: {rot: ['22*sin(tau*t)', 0, 0], pos: [0, '1.6*max(0, -cos(tau*t))', 0]}
      pierna.d: {rot: ['-22*sin(tau*t)', 0, 0], pos: [0, '1.6*max(0, cos(tau*t))', 0]}
      torso: [3, '5*sin(tau*t)', '1.5*sin(tau*t)']
      cuello: [0, '-2*sin(tau*t)', 0]
      cabeza: ['1.5*abs(sin(tau*t))', '-3*sin(tau*t)', '-1.5*sin(tau*t)']

  ataque:
    cuadros: 12
    fps: 12
    bucle: false
    claves:
      - {t: 0, pose: {}}
      - t: 0.3
        cara: decidido
        pose:
          cadera: {pos: [0, -1.8, -1]}
          torso: [-6, -16, 0]
          cuello: [-3, -4, 0]
          cabeza: [6, 12, 0]
          hombro.d: [25, 0, 6]
          codo.d: [-40, 0, 0]
      - t: 0.45
        curva: lineal
        cara: decidido
        pose:
          raiz: {pos: [0, 0, 4]}
          cadera: {pos: [0, -1.0, 0]}
          torso: [14, 22, 0]
          cuello: [-6, 4, 0]
          cabeza: [-6, -8, 0]
          hombro.d: [-108, 0, 10]
          codo.d: [-6, 0, 0]
          mano.d: [-30, 0, 0]
          pierna.d: [-16, 0, 0]
          pierna.i: [14, 0, 0]
      - t: 0.7
        cara: decidido
        pose:
          raiz: {pos: [0, 0, 4.5]}
          cadera: {pos: [0, -1.2, 0]}
          torso: [16, 24, 0]
          cuello: [-6, 4, 0]
          cabeza: [-6, -8, 0]
          hombro.d: [-112, 0, 8]
          codo.d: [-4, 0, 0]
          mano.d: [-36, 0, 0]
          pierna.d: [-18, 0, 0]
          pierna.i: [16, 0, 0]
      - {t: 1, pose: {}}

  golpe:
    cuadros: 7
    fps: 12
    bucle: false
    claves:
      - {t: 0, pose: {}}
      - t: 0.15
        curva: lineal
        cara: dolor
        pose:
          raiz: {pos: [-3, 0, -3]}
          cadera: {pos: [0, -1.2, 0]}
          torso: [-12, 0, 6]
          cuello: [-6, 0, 3]
          cabeza: [-10, 8, 6]
      - t: 0.5
        cara: dolor
        pose:
          raiz: {pos: [-4, 0, -4]}
          cadera: {pos: [0, -1.6, 0]}
          torso: [-5, 0, 3]
          cabeza: [-4, 4, 2]
      - {t: 1, cara: decidido, pose: {}}
