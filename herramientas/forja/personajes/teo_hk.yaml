# El personaje base del autor (arte/referencias/personaje_base.png) dibujado con el estilo de Hollow Knight
# (formas filosas, línea fina oscura, sombreado suave y luz de contorno), pero con los colores del dibujo
# original. Conserva el diseño del autor: cabeza redonda, ojos ovalados sin boca, pelo sin flequillo con
# remolino y mechón al costado, cuello grueso (aquí un manto corto en picos), capa de campana y botas.
# Unidades: 1 = 4 px. Mira hacia +Z; +X es su lado izquierdo.
nombre: Teo_hk
estilo: pluma
lienzo: [480, 620]
origen: [240, 560]
escala: 4
camara: {yaw: 30, pitch: 6}
luz: [-0.55, 0.6, 0.6]
tinta: '#1c140a'
fondo_bruma: ['#1d1a12', '#4a4430']
grosor: 0.42
grosor_silueta: 0.9
peso_sombra: 0.6
sombra_proyectada: 1.0
degradado: ['#ffffff', '#ddd2b8']
contraluz: ['#f3dfb0', 0.55, 0.4]

materiales:
  cara: {color: '#fcd7a0', sombra: '#e8b88a', luz: '#fff0d6', ancho_sombra: 0.22, suave: 2.2}
  ojo: {color: '#3a2c12'}
  pelo: {color: '#886632', sombra: '#6a4f2a', hondo: '#4a361c', luz: '#a8844a', brillo: 0.25, ancho_sombra: 0.14, suave: 0.8}
  capa: {color: '#594a23', sombra: '#3e3316', hondo: '#2b230e', luz: '#7c6a39', brillo: 0.2, ancho_sombra: 0.3, suave: 1.6}
  manto: {color: '#615229', sombra: '#433818', hondo: '#2e2610', luz: '#857440', brillo: 0.25, ancho_sombra: 0.32, suave: 1.4}
  pierna: {color: '#64471f', sombra: '#4a3216', luz: '#86643a'}
  bota: {color: '#64471f', sombra: '#4a3216', hondo: '#33230e', luz: '#86643a', brillo: 0.3, ancho_sombra: 0.35, suave: 1.0}

huesos:
  - {nombre: raiz}
  - {nombre: cadera, padre: raiz, pos: [0, 17, 0]}
  - {nombre: torso, padre: cadera, pos: [0, 1, 0]}
  - {nombre: cuello, padre: torso, pos: [0, 40, 0]}
  - {nombre: cabeza, padre: cuello, pos: [0, 23, 1], rot: [0, -8, 0]}
  - {nombre: pierna, padre: cadera, pos: [4.6, 2, 0], rot: [0, 0, 2], espejo: true}
  - {nombre: pie, padre: pierna, pos: [0, -17.5, 0], rot: [0, 40, 0]}
  - {nombre: hombro, padre: torso, pos: [8, 34, 0], rot: [0, 0, 8], espejo: true}
  - {nombre: codo, padre: hombro, pos: [0, -10, 0]}
  - {nombre: mano, padre: codo, pos: [0, -9, 0]}

piezas:
  # ------------------------------------------------------------------ cabeza
  - nombre: cabeza
    hueso: cabeza
    forma: elipsoide
    r: [19.5, 18.6, 18.2]
    material: cara
    calcas:
      - {ovalo: [2.7, 4.4], centro: [8.0, -1.8], angulo: 4, material: ojo, espejo: true, caras: [normal]}
      - {contorno: [[5, -6.2], [10.6, -6.2], [11, 0.4], [8, 1.6], [5, -0.6]], material: ojo, espejo: true, caras: [decidido]}
      - {trazo: [[5.6, -2.4], [8.0, -3.2], [10.4, -2.4]], anchos: [0.3, 1.1, 0.3], material: ojo, espejo: true, caras: [parpadeo]}
      - {trazo: [[10.4, 1.0], [6.6, -1.8], [10.4, -4.6]], anchos: [0.5, 1.3, 0.5], suave: false, material: ojo, espejo: true, caras: [dolor]}

  # ------------------------------------------------------------------ pelo sin flequillo, remolino y mechón al costado
  - nombre: casquete
    hueso: cabeza
    forma: elipsoide
    pos: [0, 1.6, -0.6]
    r: [20.4, 19.8, 19.2]
    material: pelo
    grupo: pelo
    capa: 3
    calcas:
      - op: resta
        suave: false
        contorno: [[-25, -2], [-21.5, 3], [-18.5, 7.0], [-14.5, 10.2], [-9.5, 12.2], [-4, 13.2], [1.5, 13.4], [7, 12.6], [11.5, 11.0], [15, 8.0], [17.4, 3.5], [18.6, -3], [22, -6], [25, -40], [-25, -40]]
  - nombre: mechones
    hueso: cabeza
    forma: mechones
    pos: [0, 1.6, -0.6]
    sobre: [20.4, 19.8, 19.2]
    material: pelo
    grupo: pelo
    capa: 3
    lista:
      # mechón largo del costado, en punta
      - {en: [16.2, 10], hacia: -98, curva: 34, largo: 22, ancho: 4.6, perfil: [1, 1, 0.7, 0], alza: [0.8, 1.2]}
      # remolino: dos cuernitos curvos
      - {en: [7, 18.5], dir: [0.35, 1, -0.2], doblez: [1.2, -0.3, 0], largo: 9, ancho: 2.0, perfil: [1, 0.7, 0]}
      - {en: [11.5, 16.5], dir: [1, 0.7, -0.15], doblez: [0.4, -0.9, 0], largo: 6.5, ancho: 1.6, perfil: [1, 0.7, 0]}
      # puntas de atrás
      - {en: [0, 4], giro: [180, 0], dir: [0, -0.5, -1], doblez: [0, -1, 0], largo: 7, ancho: 2.8, perfil: [1, 0.6, 0]}
      - {en: [-9, 2], giro: [150, 0], dir: [-0.5, -0.5, -0.8], doblez: [0, -1, 0], largo: 6.5, ancho: 2.6, perfil: [1, 0.6, 0]}
      - {en: [9, 2], giro: [-150, 0], dir: [0.5, -0.5, -0.8], doblez: [0, -1, 0], largo: 6.5, ancho: 2.6, perfil: [1, 0.6, 0]}

  # ------------------------------------------------------------------ manto corto (el cuello grueso, en picos)
  - nombre: manto
    hueso: torso
    forma: campana
    aros: [[42, 9, 7], [37.5, 13.5, 10.5], [30, 17.5, 13]]
    ondas: 5
    fase: 14
    puntas: true
    caidas: [6.5, 4.5, 7.0, 4.0, 6.0]
    redondeo: 2.0
    material: manto
    capa: 2
    trazos:
      - {puntos: [[-3, 41, 8.5], [-5.5, 35, 11.5], [-7.5, 29, 13.5]], anchos: [0, 0.45, 0], tono: hondo, normal: [0, 0, 1]}
      - {puntos: [[5, 40.5, 8.5], [8, 34.5, 11], [10, 29, 12.5]], anchos: [0, 0.4, 0], tono: hondo, normal: [0.3, 0, 1]}

  # ------------------------------------------------------------------ capa larga, rasgada en picos
  - nombre: capa
    hueso: torso
    forma: campana
    aros: [[38, 10, 8], [30, 14.5, 11], [14, 18.5, 13.5], [2, 21, 15]]
    ondas: 6
    fase: -6
    puntas: true
    caidas: [9.0, 5.5, 10.0, 6.0, 9.5, 5.0]
    redondeo: 1.6
    material: capa
    trazos:
      - {puntos: [[-6, 28, 11.5], [-7.5, 15, 14], [-8.5, 2, 15.5]], anchos: [0, 0.5, 0.15], tono: hondo, normal: [0, 0, 1]}
      - {puntos: [[7, 27, 11.5], [9, 14, 13.5], [10.5, 2, 15]], anchos: [0, 0.45, 0.1], tono: hondo, normal: [0.4, 0, 1]}

  # ------------------------------------------------------------------ brazos: viven bajo la capa y salen al atacar
  - nombre: manga
    hueso: hombro
    forma: tubo
    puntos: [[0, 0, 0, 3.2], [codo, 0, 0, 0, 2.8], [mano, 0, 2.0, 0, 3.0]]
    material: capa
    fuera_de: capa
  - nombre: mano
    hueso: mano
    forma: casco
    esferas: [[0, -0.5, 0, 2.2], [0, -3.0, 0.3, 2.0], [0.3, -4.6, 0.6, 1.4]]
    material: cara
    fuera_de: capa
    capa: 0.5

  # ------------------------------------------------------------------ piernas finas y botas en punta
  - nombre: pierna
    hueso: pierna
    forma: tubo
    puntos: [[0, 0, 0, 2.4], [pie, 0, 2, 0, 2.2]]
    material: pierna
    fuera_de: capa
    capa: -6
  - nombre: bota
    hueso: pie
    forma: casco
    esferas: [[0, 2.5, 0, 3.0], [0, 0.0, -0.6, 3.1], [0, -0.6, 3.2, 2.4], [0, -0.9, 6.8, 0.6]]
    material: bota
    capa: -5

animaciones:
  reposo:
    cuadros: 8
    fps: 8
    caras: [{desde: 0.75, hasta: 0.875, cara: parpadeo}]
    pose:
      torso: {rot: [0, 0, '0.6*sin(tau*t)'], pos: [0, '0.35*sin(tau*t)', 0]}
      cuello: ['0.8*sin(tau*t + 0.5)', 0, 0]
      cabeza: ['-1.2*sin(tau*t + 0.9)', 0, '1.0*sin(tau*t)']

  caminar:
    cuadros: 8
    fps: 10
    pose:
      raiz: {pos: [0, '0.8*abs(sin(tau*t))', 0]}
      pierna.i: {rot: ['24*sin(tau*t)', 0, 0], pos: [0, '1.4*max(0, -cos(tau*t))', 0]}
      pierna.d: {rot: ['-24*sin(tau*t)', 0, 0], pos: [0, '1.4*max(0, cos(tau*t))', 0]}
      torso: [4, '5*sin(tau*t)', '1.5*sin(tau*t)']
      cuello: [0, '-2*sin(tau*t)', 0]
      cabeza: ['1.5*abs(sin(tau*t))', '-3*sin(tau*t)', '-1.5*sin(tau*t)']

  ataque:
    cuadros: 12
    fps: 12
    bucle: false
    claves:
      - {t: 0, pose: {}}
      - t: 0.3
        cara: decidido
        pose:
          cadera: {pos: [0, -1.5, -1]}
          torso: [-6, -16, 0]
          cuello: [-3, -4, 0]
          cabeza: [6, 12, 0]
          hombro.d: [25, 0, 6]
          codo.d: [-40, 0, 0]
      - t: 0.45
        curva: lineal
        cara: decidido
        pose:
          raiz: {pos: [0, 0, 4]}
          cadera: {pos: [0, -0.8, 0]}
          torso: [14, 22, 0]
          cuello: [-6, 4, 0]
          cabeza: [-6, -8, 0]
          hombro.d: [-108, 0, 10]
          codo.d: [-6, 0, 0]
          mano.d: [-30, 0, 0]
          pierna.d: [-16, 0, 0]
          pierna.i: [14, 0, 0]
      - t: 0.7
        cara: decidido
        pose:
          raiz: {pos: [0, 0, 4.5]}
          cadera: {pos: [0, -1.0, 0]}
          torso: [16, 24, 0]
          cuello: [-6, 4, 0]
          cabeza: [-6, -8, 0]
          hombro.d: [-112, 0, 8]
          codo.d: [-4, 0, 0]
          mano.d: [-36, 0, 0]
          pierna.d: [-18, 0, 0]
          pierna.i: [16, 0, 0]
      - {t: 1, pose: {}}

  golpe:
    cuadros: 7
    fps: 12
    bucle: false
    claves:
      - {t: 0, pose: {}}
      - t: 0.15
        curva: lineal
        cara: dolor
        pose:
          raiz: {pos: [-3, 0, -3]}
          cadera: {pos: [0, -1.0, 0]}
          torso: [-12, 0, 6]
          cuello: [-6, 0, 3]
          cabeza: [-10, 8, 6]
      - t: 0.5
        cara: dolor
        pose:
          raiz: {pos: [-4, 0, -4]}
          cadera: {pos: [0, -1.4, 0]}
          torso: [-5, 0, 3]
          cabeza: [-4, 4, 2]
      - {t: 1, cara: decidido, pose: {}}
