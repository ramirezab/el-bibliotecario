# Teo, el Bibliotecario, en el estilo ilustrado (tinta y color plano, sin pixeles).
# Unidades del modelo: 1 = 4 px a escala normal. +X es el lado izquierdo de Teo; mira hacia +Z.
nombre: Teo_pluma
estilo: pluma
lienzo: [900, 780]
origen: [440, 744]
escala: 4
camara: {yaw: 30, pitch: 6}
luz: [-0.55, 0.62, 0.56]
tinta: '#141235'
grosor: 0.5
grosor_silueta: 1.0
sombra_proyectada: 1.4
degradado: ['#ffffff', '#d8d6ec']
contraluz: ['#a8c8ff', 0.7, 0.55]

materiales:
  piel: {color: '#f6d2b0', sombra: '#dc9886', luz: '#fff3e4'}
  pelo: {color: '#a8502a', sombra: '#70301f', hondo: '#4a1c16', luz: '#d98451', brillo: 0.35}
  ojo: {color: '#1c1734'}
  lente: {color: '#e4f3ff', opacidad: 0.2, sin_sombra: true, linea: '#6a3a1c'}
  cobre: {color: '#c9813f', sombra: '#8c4c24', luz: '#f6c486', brillo: 0.7, linea: '#3a1d14'}
  abrigo: {color: '#323a8a', sombra: '#1d2160', hondo: '#121440', luz: '#5a63bd', brillo: 0.25}
  abrigo_os: {color: '#272d70', sombra: '#181b4c', hondo: '#101236', luz: '#4a52a8'}
  puno: {color: '#4049a0', sombra: '#262b6a', hondo: '#161a46', luz: '#6a74c8'}
  forro: {color: '#7a2c4c', sombra: '#4a1a32'}
  liston: {color: '#d23a40', sombra: '#8e1f36', hondo: '#5c1226', luz: '#f47a5e', brillo: 0.3}
  liston_rev: {color: '#9c2638', sombra: '#681a2c'}
  oro: {color: '#ebb44e', sombra: '#a8741f', luz: '#fff2b8', brillo: 0.9, linea: '#3a2410'}
  pantalon: {color: '#3a3352', sombra: '#211c34', hondo: '#15111f'}
  bota: {color: '#7c4a2d', sombra: '#4b2a1d', hondo: '#2e1a14', luz: '#ab7148', brillo: 0.3}
  cuero: {color: '#93603a', sombra: '#5c3824', hondo: '#3a2218', luz: '#c48c5c', brillo: 0.3}
  madera: {color: '#c69d6c', sombra: '#86613e', hondo: '#5a3e26', luz: '#ead0a0', brillo: 0.4}
  pluma: {color: '#f5eedf', sombra: '#b7b2cc', hondo: '#8a86a6', luz: '#ffffff'}
  pluma_punta: {color: '#4f5c94', sombra: '#2e3666'}
  papel: {color: '#f3e8cf', sombra: '#cdb894', hondo: '#8a7a64', luz: '#fffaf0'}
  tapa: {color: '#5a2236', sombra: '#36121f', hondo: '#200a12', luz: '#8a3a52'}
  tintero: {color: '#2a2f78', sombra: '#141640', luz: '#9fb0ff', brillo: 0.8, opacidad: 0.92}
  corcho: {color: '#b88a5a', sombra: '#7a5434'}
  marca_oro: {color: '#ebb44e'}
  marca_verde: {color: '#3fa37f'}
  marca_roja: {color: '#d23a40'}
  marca_azul: {color: '#7fb6dc'}
  marca_crema: {color: '#efe2c4'}

huesos:
  - {nombre: raiz}
  - {nombre: cadera, padre: raiz, pos: [0, 45, 0]}
  - {nombre: falda, padre: cadera, pos: [0, 2, 0]}
  - {nombre: torso, padre: cadera, pos: [0, 4, 0], rot: [7, 0, 0]}
  - {nombre: cuello, padre: torso, pos: [0, 27, 0.5], rot: [-5, 0, 0]}
  - {nombre: cabeza, padre: cuello, pos: [0, 21, 2], rot: [2, 0, 0]}
  - {nombre: hombro, padre: torso, pos: [10.5, 23, -0.5], rot: [0, 0, 10], espejo: true}
  - {nombre: codo, padre: hombro, pos: [0, -14, 0]}
  - {nombre: mano, padre: codo, pos: [0, -12.5, 0]}
  - {nombre: pierna, padre: cadera, pos: [5, -1, 0], rot: [0, 0, 4], espejo: true}
  - {nombre: rodilla, padre: pierna, pos: [0, -21, 0], rot: [6, 0, -4]}
  - {nombre: pie, padre: rodilla, pos: [0, -19.5, 0], rot: [-6, 0, 0]}
  - {nombre: baculo, padre: mano.d, pos: [0, -3.5, 1.4], apunta: [-0.16, 1, 0.08], frente: [-0.5, 0, 0.85]}
  - {nombre: libro, padre: mano.i, pos: [0, -4, 4.5], apunta: [0.05, 0.92, -0.38], frente: [-0.45, 0.35, 0.82]}
  - {nombre: liston1, padre: cuello, pos: [-8.5, 1.5, 1]}
  - {nombre: liston2, padre: liston1, pos: [-5, -6, -5]}
  - {nombre: liston3, padre: liston2, pos: [-4, -8, -6]}
  - {nombre: liston4, padre: liston3, pos: [-3, -8, -6]}
  - {nombre: liston5, padre: liston4, pos: [-2, -8, -5]}

pose_base:
  hombro.d: [-12, 0, 24]
  codo.d: [-34, 0, -14]
  hombro.i: [-38, 0, -16]
  codo.i: [-78, 0, 6]

piezas:
  # ------------------------------------------------------------------ cabeza
  - nombre: cabeza
    hueso: cabeza
    forma: elipsoide
    r: [20, 19.5, 18.5]
    material: piel
    calcas:
      # ojos grandes y oscuros con dos brillos
      - {ovalo: [3.5, 4.5], centro: [7.6, -2.2], material: ojo, espejo: true, sin_caras: [parpadeo, dolor]}
      - {circulo: 1.4, centro: [6.4, -0.6], color: '#ffffff', brillo: true, espejo: true, caras: [normal]}
      - {circulo: 0.65, centro: [8.8, -4.2], color: '#ffffff', brillo: true, opacidad: 0.9, espejo: true, caras: [normal, decidido, grito]}
      - {circulo: 1.0, centro: [6.6, -2.6], color: '#ffffff', brillo: true, espejo: true, caras: [decidido, grito]}
      # párpado de enojo (decidido, grito)
      - {contorno: [[2.8, 4.0], [12.8, 4.0], [12.8, 1.0], [3.0, -1.2]], suave: false, material: piel, espejo: true, caras: [decidido, grito]}
      - {trazo: [[3.4, -0.9], [7.6, 0.3], [11.8, 1.1]], anchos: [0.9, 0.7, 0.3], material: ojo, espejo: true, caras: [decidido, grito]}
      # ojos cerrados: parpadeo y dolor
      - {trazo: [[4.4, -2.6], [7.6, -3.8], [10.8, -2.6]], anchos: [0.25, 1.0, 0.25], material: ojo, espejo: true, caras: [parpadeo]}
      - {trazo: [[10.6, 0.8], [5.0, -2.2], [10.6, -5.0]], anchos: [0.3, 1.1, 0.3], suave: false, material: ojo, espejo: true, caras: [dolor]}
      # cejas
      - {trazo: [[4.0, 6.6], [8.0, 8.0], [12.2, 7.0]], anchos: [0.5, 1.3, 0.3], color: '#5c2618', espejo: true, caras: [normal, parpadeo]}
      - {trazo: [[3.6, 4.2], [8.0, 6.0], [12.4, 7.8]], anchos: [0.6, 1.4, 0.3], color: '#5c2618', espejo: true, caras: [decidido, grito]}
      - {trazo: [[3.8, 8.8], [8.0, 7.6], [12.2, 5.8]], anchos: [0.6, 1.3, 0.3], color: '#5c2618', espejo: true, caras: [dolor]}
      # mejillas y pecas
      - {ovalo: [3.4, 2.0], centro: [12.0, -8.4], color: '#f08a7c', opacidad: 0.5, blur: 0.7, espejo: true}
      - {circulo: 0.42, centro: [10.4, -7.0], color: '#b6633f', espejo: true}
      - {circulo: 0.36, centro: [12.6, -6.4], color: '#b6633f', espejo: true}
      - {circulo: 0.38, centro: [11.6, -9.3], color: '#b6633f', espejo: true}
      - {circulo: 0.32, centro: [13.8, -8.6], color: '#b6633f', espejo: true}
      # nariz y boca
      - {trazo: [[-0.4, -5.6], [0.7, -7.1], [-0.5, -7.8]], anchos: [0.2, 0.55, 0.2], color: '#c77a66'}
      - {trazo: [[-3.0, -10.9], [0, -12.1], [3.0, -11.0]], anchos: [0.3, 0.85, 0.3], color: '#5c2230', caras: [normal, parpadeo]}
      - {trazo: [[-2.6, -11.4], [0, -11.0], [2.6, -11.5]], anchos: [0.3, 0.8, 0.3], color: '#5c2230', caras: [decidido]}
      - {contorno: [[-3.2, -10.6], [0, -10.2], [3.2, -10.6], [2.0, -14.2], [-2.0, -14.2]], color: '#5c2230', caras: [grito]}
      - {ovalo: [1.6, 0.9], centro: [0, -13.2], color: '#e0606a', caras: [grito]}
      - {trazo: [[-3.0, -11.8], [-1.4, -10.8], [0.1, -12.0], [1.6, -10.8], [3.0, -11.8]], anchos: [0.4, 0.75, 0.75, 0.75, 0.4], suave: false, color: '#5c2230', caras: [dolor]}
  - {nombre: nariz, hueso: cabeza, forma: elipsoide, pos: [0, -5.8, 17.4], r: [2.2, 2.1, 2.2], material: piel, grupo: cabeza}
  - nombre: oreja
    hueso: cabeza
    forma: elipsoide
    pos: [19.0, -3.5, -1.5]
    rot: [0, 18, -6]
    r: [2.6, 4.6, 3.0]
    material: piel
    espejo: true
    capa: -3
  - nombre: cuello
    hueso: cuello
    forma: tubo
    puntos: [[0, -3, 0], [0, 9, 0.8]]
    radio: 4.6
    material: piel
    capa: -4
  # pluma de escribir detrás de la oreja derecha
  - {nombre: pluma_oreja, hueso: cabeza, forma: lamina, pos: [-19.5, 3, -4], rot: [0, -80, 35], contorno: [[0, 0], [-1.0, 3], [-2.2, 8], [-1.8, 12], [0, 15], [1.0, 11], [1.2, 6], [0.6, 2]], material: pluma, capa: -1, grosor: 0.7,
     trazos: [{puntos: [[0, -1.5, 0.05], [0, 6, 0.05], [0, 14, 0.05]], anchos: [0.5, 0.35, 0.05], tono: hondo}]}

  # ------------------------------------------------------------------ pelo
  - nombre: casquete
    hueso: cabeza
    forma: elipsoide
    pos: [0, 1.6, -0.9]
    r: [21.6, 21.2, 20.2]
    material: pelo
    grupo: pelo
    capa: 3
    calcas:
      - op: resta
        suave: false
        contorno: [[-24, -2], [-21, 4], [-14, 8.6], [-7, 9.6], [0, 8.8], [7, 9.6], [14, 8.6], [21, 4], [24, -2], [24, -40], [-24, -40]]
      - {trazo: [[-6, 14], [-3, 4], [-4, -8]], anchos: [0, 0.6, 0], giro: [180, 0], color: '#5a2216'}
      - {trazo: [[5, 15], [3, 2], [5, -10]], anchos: [0, 0.6, 0], giro: [180, 0], color: '#5a2216'}
      - {trazo: [[0, 10], [0.5, -2], [-1, -12]], anchos: [0, 0.5, 0], giro: [180, 0], color: '#5a2216'}
      - {trazo: [[-10, 8], [-9, -2], [-11, -10]], anchos: [0, 0.5, 0], giro: [150, 0], color: '#5a2216'}
      - {trazo: [[10, 8], [9, -2], [11, -10]], anchos: [0, 0.5, 0], giro: [-150, 0], color: '#5a2216'}
      - {trazo: [[-8, 6], [0, 9], [8, 6]], anchos: [0, 0.5, 0], giro: [0, 80], color: '#5a2216'}
      # nuca y lados: el pelo no baja hasta la mandíbula
      - {op: resta, suave: false, giro: [90, 0], espejo: true, contorno: [[-24, -3], [-6, -3], [-1, -7], [3, -14], [3, -40], [-24, -40]]}
  - nombre: mechones
    hueso: cabeza
    forma: mechones
    pos: [0, 1.6, -0.9]
    sobre: [21.6, 21.2, 20.2]
    material: pelo
    grupo: pelo
    capa: 3
    rayas: true
    lista:
      # flequillo que cae sobre la frente
      - {en: [-13, 13.5], hacia: -112, curva: 34, largo: 11, ancho: 3.4}
      - {en: [-6, 15.5], hacia: -100, curva: 30, largo: 12.5, ancho: 3.7}
      - {en: [1.5, 16], hacia: -84, curva: -24, largo: 12, ancho: 3.5}
      - {en: [8.5, 15], hacia: -72, curva: -30, largo: 11, ancho: 3.3}
      - {en: [15, 12], hacia: -66, curva: -28, largo: 10, ancho: 3.0}
      # patillas
      - {en: [-20.8, 4], hacia: -94, curva: 14, largo: 9, ancho: 1.5, perfil: [1, 0.7, 0]}
      - {en: [20.8, 4], hacia: -86, curva: -14, largo: 9, ancho: 1.5, perfil: [1, 0.7, 0]}
      # el mechón que nunca baja
      - {en: [2, 19.5], dir: [0.1, 1, 0.35], doblez: [1.0, -0.2, -1.0], largo: 15, ancho: 2.2, perfil: [1, 0.85, 0]}
      # puntas de arriba, despeinadas
      - {en: [-11, 18], dir: [-0.6, 0.7, -0.4], doblez: [-0.3, -0.5, 0], largo: 8, ancho: 3.2}
      - {en: [11, 18], dir: [0.6, 0.7, -0.4], doblez: [0.3, -0.5, 0], largo: 8, ancho: 3.2}
      - {en: [0, 16], giro: [180, 25], dir: [0, 0.4, -1], doblez: [0, -0.6, 0], largo: 8, ancho: 3.4}
      - {en: [-14, 10], giro: [130, 15], dir: [-0.8, 0.3, -0.6], doblez: [0, -0.8, 0], largo: 7.5, ancho: 3.0}
      - {en: [14, 10], giro: [-130, 15], dir: [0.8, 0.3, -0.6], doblez: [0, -0.8, 0], largo: 7.5, ancho: 3.0}
      # puntas de atrás
      - {en: [0, 10], giro: [180, 0], dir: [0, -0.2, -1], doblez: [0, -1, 0.2], largo: 8.5, ancho: 3.2}
      - {en: [-9, 5], giro: [150, 0], dir: [-0.6, -0.3, -0.8], doblez: [0, -0.9, 0], largo: 8, ancho: 3.0}
      - {en: [9, 5], giro: [-150, 0], dir: [0.6, -0.3, -0.8], doblez: [0, -0.9, 0], largo: 8, ancho: 3.0}
      - {en: [0, 2], giro: [95, 25], dir: [1, 0.2, -0.4], doblez: [0, -0.9, 0], largo: 7, ancho: 2.8}
      - {en: [0, 2], giro: [-95, 25], dir: [-1, 0.2, -0.4], doblez: [0, -0.9, 0], largo: 7, ancho: 2.8}
      - {en: [0, -6], giro: [180, 0], dir: [0, -1, -0.5], doblez: [0, 0, 0.5], largo: 7, ancho: 3.0}
      - {en: [-10, -4], giro: [160, 0], dir: [-0.4, -1, -0.4], doblez: [0, 0, 0.5], largo: 6.5, ancho: 2.8}
      - {en: [10, -4], giro: [-160, 0], dir: [0.4, -1, -0.4], doblez: [0, 0, 0.5], largo: 6.5, ancho: 2.8}

  # ------------------------------------------------------------------ lentes de cobre
  - nombre: aro
    hueso: cabeza
    forma: lamina
    pos: [7.6, -2.2, 17.9]
    rot: [0, 16, 0]
    circulo: 6.2
    agujeros: [{circulo: 5.0}]
    material: cobre
    espejo: true
    grosor: 0.7
    proyecta: false
  - nombre: cristal
    hueso: cabeza
    forma: lamina
    pos: [7.6, -2.2, 17.8]
    rot: [0, 16, 0]
    circulo: 5.1
    material: lente
    espejo: true
    capa: -0.1
    sin_linea: true
    sin_silueta: true
    proyecta: false
    trazos:
      - {puntos: [[-3.2, 1.0, 0.1], [-1.6, 3.4, 0.1]], anchos: [0.5, 0.9, 0.5], tono: '#ffffff', opacidad: 0.85}
  - {nombre: puente, hueso: cabeza, forma: tubo, puntos: [[-1.5, -0.6, 18.4], [0, 0.4, 19.4], [1.5, -0.6, 18.4]], radio: 0.55, material: cobre, proyecta: false, grosor: 0.7}
  - {nombre: patilla, hueso: cabeza, forma: tubo, puntos: [[13.6, -1.2, 15.2], [18.4, -0.8, 8], [19.6, -1.6, -1]], radio: 0.5, material: cobre, espejo: true, capa: -2, grosor: 0.7}

  # ------------------------------------------------------------------ listón rojo (bufanda)
  - nombre: bufanda_atras
    hueso: cuello
    forma: tubo
    puntos: [[-8.2, 2, 0], [-6, 2.4, -5.6], [0, 2.8, -7.8], [6, 2.4, -5.6], [8.2, 2, 0]]
    radio: 3.2
    material: liston
  - nombre: bufanda
    hueso: cuello
    forma: tubo
    puntos: [[8.4, 2, 0], [6.8, 1.6, 5.2], [0, 0.4, 8.2], [-6.8, 1.0, 5.4], [-8.4, 2, 0]]
    radio: 3.5
    material: liston
    capa: 3
    trazos:
      - {puntos: [[7.6, 3.6, 4.4], [0, 2.4, 10.6], [-7.6, 3.2, 4.8]], anchos: [0.1, 0.4, 0.1], tono: '#f2c060', normal: [0, 0, 1]}
      - {puntos: [[7.4, 0.4, 4.6], [0, -1.2, 10.4], [-7.4, -0.2, 4.8]], anchos: [0.1, 0.4, 0.1], tono: '#f2c060', normal: [0, 0, 1]}
  - nombre: nudo
    hueso: cuello
    forma: elipsoide
    pos: [-5.6, 0.2, 7.9]
    r: [2.6, 2.4, 1.9]
    material: liston
    capa: 4
  - nombre: cola_frente
    hueso: cuello
    forma: cinta
    puntos: [[-5.8, -1.5, 8.2], [torso, -8.0, 16, 9.6], [torso, -8.6, 8, 9.8]]
    ancho: 5.6
    normal: [0, 0, 1]
    cola: v
    material: liston
    reverso: liston_rev
    capa: 3.5
    trazos:
      - {puntos: [[-5.8, -1.5, 8.4], [torso, -8.0, 16, 9.8], [torso, -8.6, 9.5, 10.0]], anchos: [0.1, 0.35, 0.1], tono: '#f2c060'}
  - nombre: cola_larga
    hueso: liston1
    forma: cinta
    puntos: [[liston1, 0, 0, 0], [liston2, 0, 0, 0], [liston3, 0, 0, 0], [liston4, 0, 0, 0], [liston5, 0, 0, 0]]
    anchos: [5.2, 6.6, 6.6, 6.4]
    normal: [0.6, 0, -0.8]
    cola: v
    material: liston
    reverso: liston_rev
    trazos:
      - {puntos: [[liston2, 0.1, 0, 0], [liston3, 0.1, 0, 0], [liston4, 0.1, 0, 0]], anchos: [0, 0.35, 0], tono: '#f2c060'}

  # ------------------------------------------------------------------ abrigo
  - nombre: abrigo
    hueso: torso
    forma: casco
    esferas:
      - [-9.5, 22.5, -0.5, 4.8]
      - [9.5, 22.5, -0.5, 4.8]
      - [0, 24, -0.5, 5.2]
      - [-7.2, 12, 1.0, 6.2]
      - [7.2, 12, 1.0, 6.2]
      - [0, 14, 2.6, 6.6]
      - [-6.8, 1, 0, 6.0]
      - [6.8, 1, 0, 6.0]
      - [0, 2, 1.8, 6.0]
    material: abrigo
    trazos:
      - {puntos: [[-1.2, 22, 5.6], [-1.6, 12, 9.0], [-1.8, 0, 7.8]], anchos: [0.3, 0.55, 0.4], tono: linea, normal: [0, 0, 1]}
      - {puntos: [[5.5, 18, 7.0], [8, 12, 7.0], [9.5, 5, 5.8]], anchos: [0, 0.35, 0], tono: hondo, normal: [0, 0, 1]}
      - {puntos: [[-0.4, 22, 5.8], [-0.6, 12, 9.3], [-0.8, 1, 8.0]], ancho: 0.22, guiones: [1.0, 0.8], tono: luz, normal: [0, 0, 1]}
  - {nombre: solapa, hueso: torso, forma: lamina, pos: [3.2, 18.5, 8.3], rot: [-14, 14, 0], contorno: [[-2.6, 7], [4.6, 6.4], [5.4, 0], [2.2, -5], [-1.4, -8]], suave: false, material: abrigo_os, espejo: true, una_cara: true, dentro_de: abrigo, grosor: 0.7,
     trazos: [{puntos: [[-2.0, 6.2, 0.05], [4.4, 5.7, 0.05], [4.9, 0.2, 0.05], [2.0, -4.6, 0.05], [-1.2, -7.2, 0.05]], ancho: 0.32, tono: '#c79a46', suave: false}]}
  - nombre: faldon
    hueso: falda
    forma: casco
    espejo: true
    esferas:
      - [0, 4, 3.0, 4.8]
      - [6.8, 4, 0, 6.0]
      - [3, 4, -4.0, 4.8]
      - [4.6, -29, 6.4, 0.7]
      - [12.5, -28, 4.6, 0.7]
      - [16.5, -26, -2.5, 0.7]
      - [12, -25.5, -9.5, 0.7]
      - [2.5, -26, -10.5, 0.7]
