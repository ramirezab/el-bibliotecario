    pose:
      torso: {rot: ['1.2*sin(tau*t)', 0, 0], pos: [0, '0.45*sin(tau*t)', 0]}
      cabeza: ['-1.5*sin(tau*t + 0.6)', 0, '0.8*sin(tau*t)']
      hombro.d: ['1.5*sin(tau*t + 0.3)', 0, 0]
      hombro.i: ['-2*sin(tau*t + 0.3)', 0, 0]
      libro: ['2*sin(tau*t + 1.0)', 0, 0]
      falda: ['0.8*sin(tau*t - 0.5)', 0, 0]
